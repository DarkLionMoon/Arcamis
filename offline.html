<!DOCTYPE html>
<html lang="it" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080a0e">
<title>Offline — Arcamis</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{--bg:#080a0e;--gold:#d4af37;--gold3:#e8cf7a;--text:#e9e2d0;--text2:#c9c1ad;
    --font-title:'Cinzel',Georgia,serif;--font-body:Georgia,serif;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse 80% 60% at 50% 0%,#141a26 0%,var(--bg) 60%,#05070a 100%);
    color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.7;
    padding:32px 20px;text-align:center}
  main{max-width:560px}
  .rune{font-size:44px;line-height:1;margin-bottom:16px;filter:drop-shadow(0 0 20px rgba(212,175,55,.35))}
  h1{font-family:var(--font-title);font-size:clamp(20px,4.4vw,26px);color:var(--gold3);margin:0 0 10px}
  p{color:var(--text2);margin:0 0 24px}
  button, a.btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:11px 22px;
    font-family:var(--font-title);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--gold3);text-decoration:none;border:1px solid rgba(212,175,55,.28);border-radius:3px;
    background:rgba(212,175,55,.1);cursor:pointer;transition:.18s}
  button:hover,a.btn:hover{background:rgba(212,175,55,.2)}
</style>
</head>
<body>
<main>
  <div class="rune">🕯️</div>
  <h1>Sei fuori dalla rete</h1>
  <p>Le pagine che hai già visitato restano disponibili. Questa non è ancora nella cache del tuo dispositivo: riconnettiti e riprova.</p>
  <button onclick="location.reload()">Riprova</button>
  <a class="btn" href="/">Home</a>
</main>
<script>
  window.addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
