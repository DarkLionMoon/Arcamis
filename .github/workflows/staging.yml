name: Staging Deploy

on:
  push:
    branches: [preview, staging]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages (Preview)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check secrets
        id: check
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "⚠️  Secrets mancanti (CF_API_TOKEN, CF_ACCOUNT_ID): deploy GitHub saltato. Il sito si aggiorna tramite l'integrazione Git di Cloudflare Pages."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo 'Deploy Actions saltato: credenziali Cloudflare mancanti. Consultare il check Cloudflare Pages per il deploy tramite integrazione Git.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Setup Node
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.configured == 'true'
        run: |
          npm ci
          npm ci --prefix admin

      - name: Build site and Vue admin
        if: steps.check.outputs.configured == 'true'
        run: npm run build

      # L'action senza `wranglerVersion` riusa il wrangler del progetto; se non
      # lo trovasse installerebbe l'ultima v4, cioè una versione diversa da
      # quella fissata in package.json. Qui si fallisce prima, con un messaggio
      # chiaro, invece di deployare con un wrangler non previsto.
      - name: Versione di wrangler fissata dal progetto
        if: steps.check.outputs.configured == 'true'
        run: |
          npx --no-install wrangler --version
          node -e "const p=require('./package.json');process.stdout.write('package.json: ' + p.devDependencies.wrangler + '\n')"

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.check.outputs.configured == 'true'
        # `cloudflare/pages-action` è deprecata e archiviata: la sostituisce
        # wrangler-action, che esegue `wrangler pages deploy` (in wrangler 4
        # `pages publish` è stato rimosso). Stesso progetto, stesso branch.
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          # I flag sono quelli verificati con `wrangler pages deploy --help`:
          # `--project-name` e `--branch`. Il valore è fra apici singoli YAML,
          # quindi l'apice interno di 'arcamis' è raddoppiato.
          command: 'pages deploy dist --project-name=${{ secrets.CF_PAGES_PROJECT || ''arcamis'' }} --branch=${{ github.head_ref || github.ref_name }}'
          gitHubToken: ${{ github.token }}

      # Prima di annunciare la preview: se il digest pubblicato non è quello
      # costruito (e quindi testato), la preview non va considerata pronta.
      - name: Verifica che il deploy corrisponda all'artefatto costruito
        if: steps.check.outputs.configured == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOYMENT_ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          node scripts/verify-deploy.mjs \
            "$DEPLOYMENT_URL" \
            "$DEPLOYMENT_ALIAS_URL"

      - name: Preview verificata nel riepilogo
        if: steps.check.outputs.configured == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOYMENT_ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          printf '### Preview verificata\n\n[Apri il deploy](%s)\n' "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$DEPLOYMENT_ALIAS_URL" ]; then
            printf '\n[Alias del branch](%s)\n' "$DEPLOYMENT_ALIAS_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
