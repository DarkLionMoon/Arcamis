name: Staging Deploy

on:
  push:
    branches: [preview, staging]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages (Preview)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets
        id: check
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "⚠️  Secrets mancanti (CF_API_TOKEN, CF_ACCOUNT_ID): deploy GitHub saltato. Il sito si aggiorna tramite l'integrazione Git di Cloudflare Pages."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Setup Node
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.configured == 'true'
        run: |
          npm ci
          npm ci --prefix admin

      - name: Build site and Vue admin
        if: steps.check.outputs.configured == 'true'
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.check.outputs.configured == 'true'
        # `cloudflare/pages-action` è deprecata e archiviata: la sostituisce
        # wrangler-action, che esegue `wrangler pages deploy` (in wrangler 4
        # `pages publish` è stato rimosso). Stesso progetto, stesso branch.
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          # I flag sono quelli verificati con `wrangler pages deploy --help`:
          # `--project-name` e `--branch`. Il valore è fra apici singoli YAML,
          # quindi l'apice interno di 'arcamis' è raddoppiato.
          command: 'pages deploy dist --project-name=${{ secrets.CF_PAGES_PROJECT || ''arcamis'' }} --branch=${{ github.ref_name }}'
          # La major è fissata: senza `wranglerVersion` l'action installa l'ultima v4,
          # che è comunque quella attesa, ma così il deploy non cambia da solo.
          wranglerVersion: '4'
          gitHubToken: ${{ github.token }}
          # preview deployments get unique URLs like: https://<branch>.<project>.pages.dev

      # Prima di annunciare la preview: se il digest pubblicato non è quello
      # costruito (e quindi testato), la preview non va considerata pronta.
      - name: Verifica che il deploy corrisponda all'artefatto costruito
        if: steps.check.outputs.configured == 'true'
        run: |
          node scripts/verify-deploy.mjs \
            "${{ steps.deploy.outputs.deployment-url }}" \
            "${{ steps.deploy.outputs.pages-deployment-alias-url }}" \
            "https://${{ github.head_ref || github.ref_name }}.${{ secrets.CF_PAGES_PROJECT || 'arcamis' }}.pages.dev"

      - name: Post preview URL
        if: github.event_name == 'pull_request'
        run: |
          PREVIEW_URL="https://${{ github.head_ref }}.${{ secrets.CF_PAGES_PROJECT || 'arcamis' }}.pages.dev"
          echo "Preview deploy ready at: $PREVIEW_URL"
          gh pr comment ${{ github.event.pull_request.number }} --body "🚀 **Preview deploy ready!**\n\n🔗 **URL:** $PREVIEW_URL\n\n*Questo deploy viene aggiornato automaticamente ad ogni push su questo branch.*"
        env:
          GH_TOKEN: ${{ github.token }}