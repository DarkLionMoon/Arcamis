name: Validate registry

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate registry + pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate (sync-registry --check)
        run: python3 scripts/sync-registry.py --check

      - name: Verify generated artifacts are idempotent
        run: |
          python3 scripts/sync-registry.py
          if [ -n "$(git status --porcelain)" ]; then
            echo "✗ I generati non sono allineati: esegui scripts/sync-registry.py e committa."
            git status --porcelain
            exit 1
          fi
          echo "✓ Artifact allineati con il registry."
