name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: sitemap.xml e robots.txt allineati alle rotte
        run: node scripts/gen-seo-static.mjs --check

  admin:
    name: Admin typecheck, tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 scripts/sync-registry.py --check

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json
      - run: npm ci
      - run: npm ci --prefix admin
      - name: Installa Chromium
        working-directory: admin
        run: npx playwright install --with-deps chromium
      - name: Esegui gli E2E
        working-directory: admin
        run: npm run test:e2e
      - name: Artefatti dei test (screenshot, trace)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: admin/test-results/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, admin, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm ci --prefix admin
      # Lo stesso script di build usato dallo staging: dist/ dell'artefatto
      # testato e di quello pubblicato nascono dallo stesso percorso.
      - run: npm run build
      # integrità delle rotte sul dist appena prodotto (meta, sitemap, 404, PWA, font)
      - run: npm run test:dist
      # Il digest resta nel riepilogo della run: è il valore con cui il deploy
      # verifica che ciò che pubblica sia l'artefatto appena testato.
      - name: Digest dell'artefatto nel riepilogo
        run: node scripts/build-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
