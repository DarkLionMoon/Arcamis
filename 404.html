<!DOCTYPE html>
<html lang="it" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080a0e">
<title>Pagina non trovata — Arcamis</title>
<meta name="robots" content="noindex, follow">
<meta name="description" content="La pagina cercata non esiste o è stata spostata. Torna alla wiki di Arcamis per continuare a esplorare il mondo.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{
    --bg:#080a0e;--bg2:#0d1016;--gold:#d4af37;--gold3:#e8cf7a;
    --text:#e9e2d0;--text2:#c9c1ad;--line:rgba(212,175,55,.18);
    --font-title:'Cinzel',Georgia,'Times New Roman',serif;
    --font-body:Georgia,'Iowan Old Style','Times New Roman',serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse 80% 60% at 50% 0%,#141a26 0%,var(--bg) 60%,#05070a 100%);
    color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.7;
    padding:32px 20px calc(32px + env(safe-area-inset-bottom));text-align:center;
  }
  main{max-width:620px;width:100%}
  .sigil{
    font-family:var(--font-title);font-size:13px;letter-spacing:.42em;text-transform:uppercase;
    color:var(--gold);opacity:.85;margin-bottom:18px;
  }
  .code{
    font-family:var(--font-title);font-size:clamp(64px,18vw,120px);font-weight:900;line-height:1;
    color:transparent;background:linear-gradient(180deg,var(--gold3),#8a6d1f);
    -webkit-background-clip:text;background-clip:text;
    text-shadow:0 0 44px rgba(212,175,55,.22);margin:0;
  }
  h1{font-family:var(--font-title);font-size:clamp(20px,4.4vw,28px);font-weight:700;color:var(--gold3);margin:14px 0 10px}
  p{color:var(--text2);margin:0 auto 26px;max-width:46ch}
  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a.btn{
    display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:11px 22px;
    font-family:var(--font-title);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--gold3);text-decoration:none;border:1px solid var(--line);border-radius:3px;
    background:rgba(212,175,55,.06);transition:.18s;
  }
  a.btn:hover,a.btn:focus-visible{background:rgba(212,175,55,.16);border-color:rgba(212,175,55,.45);outline:none}
  a.btn--solid{background:rgba(212,175,55,.16);color:#fff}
  .hint{margin-top:28px;font-size:12px;color:#9a927f;letter-spacing:.04em}
  .hint a{color:var(--gold);text-underline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="sigil">Arcamis</div>
  <div class="code">404</div>
  <h1>Questa pagina non è mai stata scritta</h1>
  <p>La mappa finisce qui: il link è sbagliato, oppure la pagina è stata rinominata. Puoi tornare alla città o cercare nella wiki.</p>
  <div class="actions">
    <a class="btn btn--solid" href="/">← Torna alla home</a>
    <a class="btn" href="/regole/regole-del-server">Regole del server</a>
    <a class="btn" href="/changelog">Changelog</a>
  </div>
  <div class="hint">Errore registrato come 404 · <a href="/credits">Crediti &amp; legale</a></div>
</main>
</body>
</html>
