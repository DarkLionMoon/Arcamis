<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcamis Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/scripts/css/style-notion.css">
<style>
:root {
  --bg:#080a0e; --bg2:#0c0f15; --bg3:#10141c; --bg4:#161c26;
  --panel:#0e121a; --bdr:#1e1808; --bdr2:#2c2210;
  --gold:#c89b3c; --gold2:#d4aa4a; --gold3:#e8c86a;
  --copper:#7a5018; --parch:#c4a862;
  --text:#a08848; --text2:#786438; --text3:#483c1c; --white:#f0e6d2;
  --red:#c04040; --green:#4a9a58; --blue:#4a7a9a;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Crimson Pro',serif;font-size:15px;overflow:hidden;height:100vh}

/* ── LOGIN ── */
#login{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:24px}
#login h1{font-family:'Cinzel',serif;color:var(--gold2);font-size:28px;letter-spacing:.12em}
#login .sub{color:var(--text3);font-size:14px;margin-top:-16px}
.login-card{background:var(--bg2);border:1px solid var(--bdr2);border-radius:12px;padding:36px;width:min(380px,90vw);display:flex;flex-direction:column;gap:16px}
.login-card input{background:var(--bg3);border:1px solid var(--bdr);border-radius:6px;color:var(--white);font-family:'JetBrains Mono',monospace;font-size:14px;padding:12px 16px;outline:none;transition:border-color .2s}
.login-card input:focus{border-color:var(--gold)}
.login-card input::placeholder{color:var(--text3)}
.login-btn{background:var(--gold);color:var(--bg);border:none;border-radius:6px;font-family:'Cinzel',serif;font-size:13px;font-weight:700;letter-spacing:.1em;padding:13px;cursor:pointer;transition:all .2s}
.login-btn:hover{background:var(--gold2);box-shadow:0 0 24px rgba(200,155,60,.3)}
.login-err{color:var(--red);font-size:13px;text-align:center;display:none}

/* ── APP SHELL ── */
#app{display:none;height:100vh;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:6px 16px;background:var(--bg2);border-bottom:1px solid var(--bdr2);flex-shrink:0;z-index:50}
.topbar h1{font-family:'Cinzel',serif;color:var(--gold2);font-size:14px;letter-spacing:.08em;white-space:nowrap}
.topbar-sep{width:1px;height:18px;background:var(--bdr2)}
.topbar-section{font-size:12px;color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;text-align:center}
.topbar-status{font-size:10px;padding:2px 8px;border-radius:4px;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.topbar-status.idle{color:var(--text3);background:var(--bg3)}
.topbar-status.saving{color:var(--gold);background:rgba(200,155,60,.1)}
.topbar-status.ok{color:var(--green);background:rgba(74,154,88,.1)}
.topbar-status.err{color:var(--red);background:rgba(192,64,64,.1)}
.topbar .user-chip{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--bdr);border-radius:4px;padding:3px 8px;font-size:11px;color:var(--text2);flex-shrink:0;font-family:'JetBrains Mono',monospace}
.topbar .user-chip .uc-role{color:var(--gold);font-size:9px;text-transform:uppercase;letter-spacing:.06em}
.logout-btn{background:none;border:1px solid var(--bdr2);border-radius:4px;color:var(--text3);font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 9px;cursor:pointer;transition:all .2s;flex-shrink:0}
.logout-btn:hover{border-color:var(--red);color:var(--red)}

/* ── LAYOUT ── */
.layout{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{width:220px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--bdr2);display:flex;flex-direction:column;overflow:hidden}
.sidebar-search{padding:8px 10px;border-bottom:1px solid var(--bdr2)}
.sidebar-search input{width:100%;background:var(--bg3);border:1px solid var(--bdr);border-radius:4px;color:var(--white);font-size:11.5px;padding:5px 9px;outline:none;font-family:'JetBrains Mono',monospace}
.sidebar-search input:focus{border-color:var(--gold)}
.sidebar-scroll{flex:1;overflow-y:auto;padding:4px 0}
.sidebar-scroll::-webkit-scrollbar{width:4px}
.sidebar-scroll::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:2px}
.sb-group{margin-bottom:2px}
.sb-label{font-family:'Cinzel',serif;font-size:8.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);padding:6px 12px 2px;user-select:none;display:flex;align-items:center;justify-content:space-between}
.sb-add{background:none;border:1px solid var(--bdr);color:var(--text3);border-radius:3px;width:16px;height:16px;font-size:11px;line-height:1;cursor:pointer;font-family:'JetBrains Mono',monospace;transition:all .15s}
.sb-add:hover{color:var(--gold);border-color:var(--gold)}
.sb-item{display:flex;align-items:center;gap:6px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--text2);transition:all .12s;border-left:2px solid transparent}
.sb-item:hover{background:rgba(200,155,60,.04);color:var(--text)}
.sb-item.active{background:rgba(200,155,60,.06);color:var(--gold);border-left-color:var(--gold)}
.sb-item .ico{font-size:13px;width:18px;text-align:center;flex-shrink:0}
.sb-item .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-item.sb-home{margin-bottom:4px;border-bottom:1px solid var(--bdr)}

/* ── DASHBOARD ── */
.dash{flex:1;overflow-y:auto;padding:18px 24px 40px}
.dash-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.dash-head h2{font-family:'Cinzel',serif;font-size:17px;color:var(--gold2);letter-spacing:.05em;flex:1;min-width:150px}
.dash-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:22px}
.stat-card{background:var(--bg2);border:1px solid var(--bdr);border-radius:8px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .15s}
.stat-card:hover{border-color:var(--gold);transform:translateY(-1px)}
.stat-card .sc-ico{font-size:20px;width:34px;height:34px;background:var(--bg3);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-card .sc-num{font-family:'JetBrains Mono',monospace;font-size:18px;color:var(--gold);line-height:1}
.stat-card .sc-lbl{font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;font-family:'JetBrains Mono',monospace;margin-top:2px}
.dash-sec{margin-bottom:20px}
.dash-sec-title{font-family:'Cinzel',serif;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.dash-sec-title .ds-count{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text3);background:var(--bg3);padding:1px 7px;border-radius:10px}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.dash-card{display:flex;align-items:center;gap:9px;background:var(--bg2);border:1px solid var(--bdr);border-radius:7px;padding:8px 11px;cursor:pointer;transition:all .13s;min-width:0}
.dash-card:hover{border-color:var(--gold);background:rgba(200,155,60,.04)}
.dash-card .dc-ico{font-size:14px;width:20px;text-align:center;flex-shrink:0}
.dash-card .dc-lbl{flex:1;font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dash-card .dc-type{font-size:9px;color:var(--text3);font-family:'JetBrains Mono',monospace;flex-shrink:0}
.dash-empty{color:var(--text3);font-size:13px;padding:24px;text-align:center}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text3)}
.main-empty .ico{font-size:40px;opacity:.3}
.main-empty p{font-size:14px}

/* ── EDITOR ── */
.editor{flex:1;display:flex;flex-direction:column;overflow:hidden}
.editor-head{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--bdr2);flex-shrink:0;flex-wrap:wrap}
.editor-head h2{font-family:'Cinzel',serif;font-size:15px;color:var(--gold);letter-spacing:.04em;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:120px}
.editor-head h2.ed{display:flex;align-items:center;gap:8px}
.editor-head h2 .ed-icon{flex-shrink:0}
.editor-head h2 .ed-title{min-width:0;flex:1}
.editor-head h2 .ed-path{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text3);font-weight:400;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.editor-head .badge{font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 8px;border-radius:4px;flex-shrink:0}
.badge-idle{color:var(--text3);background:var(--bg3)}
.badge-dirty{color:var(--gold);background:rgba(200,155,60,.1)}
.badge-ok{color:var(--green);background:rgba(74,154,88,.1)}
.editor-actions{display:flex;gap:6px;flex-shrink:0}
.btn{border:none;border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:11px;padding:7px 14px;cursor:pointer;transition:all .15s;font-weight:500}
.btn-ghost{background:var(--bg3);color:var(--text2);border:1px solid var(--bdr)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn-primary{background:var(--gold);color:var(--bg)}
.btn-primary:hover{background:var(--gold2);box-shadow:0 0 16px rgba(200,155,60,.25)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-danger{background:none;border:1px solid var(--red);color:var(--red)}
.btn-danger:hover{background:var(--red);color:var(--bg)}
.btn-danger:disabled{opacity:.4;cursor:not-allowed}

/* Layout select */
.layout-select{background:var(--bg3);border:1px solid var(--bdr);border-radius:5px;color:var(--gold);font-family:'JetBrains Mono',monospace;font-size:11px;padding:6px 10px;cursor:pointer;outline:none;transition:border-color .15s;max-width:260px}
.layout-select:focus{border-color:var(--gold)}
.layout-select option{background:var(--bg2);color:var(--white)}

/* Toolbar */
.editor-toolbar{display:flex;gap:1px;padding:4px 12px;border-bottom:1px solid var(--bdr2);flex-shrink:0;flex-wrap:wrap;align-items:center;position:relative;background:var(--bg2)}
.tb{background:none;border:1px solid transparent;border-radius:4px;color:var(--text2);font-size:11px;padding:4px 7px;cursor:pointer;transition:all .12s;font-family:'JetBrains Mono',monospace;line-height:1;white-space:nowrap}
.tb:hover{background:rgba(200,155,60,.08);color:var(--gold);border-color:var(--bdr)}
.tb.active{background:rgba(200,155,60,.12);color:var(--gold);border-color:var(--bdr)}
.tb:disabled{opacity:.35;cursor:default}
.tb-sep{width:1px;background:var(--bdr);margin:2px 3px;align-self:stretch}
.editor-toolbar .tb-spacer{flex:1}
.editor-toolbar .view-switch{display:flex;gap:1px;background:var(--bg3);border:1px solid var(--bdr);border-radius:5px;padding:1px;margin-left:4px}
.view-switch .tb{border:none;padding:3px 8px;font-size:10px}
.view-switch .tb.active{background:rgba(200,155,60,.2)}

/* Editor panes */
.editor-body{flex:1;display:flex;overflow:hidden}
.pane{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.pane-head{font-family:'Cinzel',serif;font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:4px 14px;border-bottom:1px solid var(--bdr);background:var(--bg2);flex-shrink:0;display:flex;align-items:center;gap:8px}
.pane-head .ph-info{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:400;letter-spacing:.03em;color:var(--text3);text-transform:none}
.pane+.pane{border-left:1px solid var(--bdr2)}
.pane textarea{flex:1;background:var(--bg);color:var(--white);border:none;resize:none;padding:14px 16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.75;outline:none;tab-size:2}
.pane textarea::placeholder{color:var(--text3)}
.pane-preview{flex:1;overflow-y:auto;background:var(--bg);outline:none;padding:0;position:relative}
.pane-preview:empty::before{content:'👁 Anteprima vuota — scrivi a sinistra';display:block;padding:16px;color:var(--text3);font-family:'JetBrains Mono',monospace;font-size:11px}
.pane-preview.zoomed img{cursor:zoom-out}
.pane-preview:not(.zoomed) img{cursor:zoom-in}
.e-pv{max-width:760px;margin:0 auto;padding:26px 32px 70px}
.e-pv-head{display:flex;align-items:center;gap:12px;padding-bottom:14px;margin-bottom:18px;border-bottom:1px solid rgba(200,155,60,.18)}
.e-pv-head .epv-icon{font-size:30px;line-height:1}
.e-pv-head .epv-title{font-family:'Cinzel',serif;font-size:20px;font-weight:700;color:var(--gold3);letter-spacing:.05em}
.e-pv-head .epv-sub{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--text3);letter-spacing:.05em;margin-top:2px}
.e-pv>*+*{margin-top:.7em}
.e-pv .n-h1:first-child{margin-top:8px!important}

/* ── DASHBOARD ── */
.dash{max-width:920px;margin:0 auto;padding:26px 24px 80px;overflow-y:auto;height:100%}
.dash-head{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.dash-head h2{font-family:'Cinzel',serif;color:var(--gold2);font-size:22px;letter-spacing:.08em;margin-right:auto}
.dash-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:22px}
.stat-card{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;padding:14px 16px;cursor:pointer;transition:all .15s}
.stat-card:hover{border-color:var(--gold);transform:translateY(-1px)}
.stat-card .sc-ico{font-size:24px}
.stat-card .sc-num{font-family:'Cinzel',serif;font-size:22px;color:var(--gold3);line-height:1}
.stat-card .sc-lbl{font-size:11px;color:var(--text2);letter-spacing:.04em;margin-top:3px;text-transform:uppercase}
.dash-sec{margin-bottom:22px}
.dash-sec-title{display:flex;align-items:center;gap:8px;font-family:'Cinzel',serif;font-size:13px;color:var(--gold2);letter-spacing:.06em;margin-bottom:10px}
.dash-sec-title .ds-count{background:var(--bg3);border:1px solid var(--bdr);border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text2);padding:1px 8px}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.dash-card{display:flex;flex-direction:column;gap:4px;background:var(--bg2);border:1px solid var(--bdr);border-radius:8px;padding:11px 13px;cursor:pointer;transition:all .15s;position:relative}
.dash-card:hover{border-color:var(--gold);transform:translateY(-1px)}
.dash-card .dc-ico{font-size:18px}
.dash-card .dc-lbl{font-size:13px;color:var(--white);line-height:1.3;word-break:break-word}
.dash-card .dc-type{position:absolute;top:9px;right:11px;font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);border:1px solid var(--bdr);padding:1px 6px;border-radius:3px}
.sb-item.sb-home{border-bottom:1px solid var(--bdr);margin-bottom:4px}

/* Divider */
.divider-v{width:5px;background:var(--bg2);cursor:col-resize;flex-shrink:0;position:relative;border-left:1px solid var(--bdr);border-right:1px solid var(--bdr)}
.divider-v::after{content:'';position:absolute;left:2px;top:50%;width:1px;height:34px;background:var(--bdr);transform:translateY(-50%)}
.divider-v:hover,.divider-v.dragging{background:rgba(200,155,60,.08)}

/* Metadati in linea (sopra il testo) */
.md-meta{flex-shrink:0;padding:7px 14px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bg)}
.md-meta input,.md-meta select{border:1px solid var(--bdr);background:var(--bg3);color:var(--white);border-radius:4px;padding:4px 7px;font-family:'JetBrains Mono',monospace;font-size:11px;outline:none;transition:border-color .15s}
.md-meta input:focus,.md-meta select:focus{border-color:var(--gold)}
.md-meta .mm-t{flex:1;min-width:140px}
.md-meta .mm-layout{max-width:200px}
.md-meta label{font-size:8.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;font-family:'JetBrains Mono',monospace;display:flex;flex-direction:column;gap:2px}
.md-meta label span{display:flex;align-items:center;gap:4px}

/* Outline (sommario sezioni) */
.md-outline{width:0;flex-shrink:0;border-left:1px solid var(--bdr);background:var(--bg2);overflow:hidden;transition:width .15s;display:flex;flex-direction:column}
.md-outline.open{width:200px}
.md-outline .ol-head{font-family:'Cinzel',serif;font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:8px 12px 4px;flex-shrink:0}
.md-outline .ol-body{flex:1;overflow-y:auto;padding:2px 6px 12px}
.ol-item{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text2);font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 7px;border-radius:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.ol-item:hover{color:var(--gold);background:rgba(200,155,60,.06)}
.ol-item.h1{color:var(--gold2);font-weight:600;margin-top:6px}
.ol-item.h2{color:var(--text2)}
.ol-item.h3,.ol-item.h4{color:var(--text3);padding-left:18px}

/* Statusbar */
.statusbar{display:flex;align-items:center;gap:14px;padding:3px 14px;background:var(--bg2);border-top:1px solid var(--bdr);flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text3)}
.statusbar .st-r{margin-left:auto;display:flex;gap:14px}

/* JSON mode */
.json-pane{display:none;flex:1;flex-direction:column;overflow:hidden}
.json-pane.active{display:flex}
.json-pane textarea{flex:1;background:var(--bg);color:var(--green);border:none;resize:none;padding:16px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.6;outline:none}

/* Site mode */
#site-frame{flex:1;width:100%;border:none;background:#fff;display:none}

/* ── TOAST ── */
#toast{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--bg2);border:1px solid var(--bdr2);border-radius:8px;padding:10px 16px;font-size:13px;color:var(--white);box-shadow:0 4px 20px rgba(0,0,0,.5);animation:toastIn .25s ease;pointer-events:auto}
.toast.success{border-color:var(--green)}
.toast.error{border-color:var(--red)}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ── MODAL IMMAGINE ── */
.img-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:400}
.img-modal{background:var(--bg2);border:1px solid var(--bdr2);border-radius:12px;width:min(480px,92vw);padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.img-modal h3{font-family:'Cinzel',serif;color:var(--gold2);font-size:14px;letter-spacing:.08em}
.img-field{display:flex;flex-direction:column;gap:5px}
.img-field label{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--text3)}
.img-field input{background:var(--bg3);border:1px solid var(--bdr);border-radius:5px;color:var(--white);font-size:13px;padding:8px 10px;outline:none;font-family:'Crimson Pro',serif}
.img-field input:focus{border-color:var(--gold)}
.img-or{display:flex;align-items:center;gap:10px;color:var(--text3);font-family:'Cinzel',serif;font-size:9px;letter-spacing:.15em;text-transform:uppercase}
.img-or::before,.img-or::after{content:'';flex:1;height:1px;background:var(--bdr)}
.img-upload{position:relative;border:1px dashed var(--bdr2);border-radius:6px;padding:18px;text-align:center;cursor:pointer;background:var(--bg3)}
.img-upload:hover{border-color:var(--gold)}
.img-upload input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.img-upload-txt{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.12em;color:var(--text2);text-transform:uppercase}
.img-preview{display:none;width:100%;max-height:180px;object-fit:contain;border-radius:6px;border:1px solid var(--bdr);background:var(--bg3)}
.img-preview.show{display:block}
.img-actions{display:flex;gap:8px;justify-content:flex-end}

function _autosaveKey(){var u=_currentUser||'anon';var c=_current;return 'arc_autosave_'+u+'_'+(c&&(c.k||c.file)||'')}
function _autosaveLoad(){
  try{return JSON.parse(localStorage.getItem(_autosaveKey())||'null')}catch(e){return null}
}
function _autosaveStore(content){
  localStorage.setItem(_autosaveKey(),JSON.stringify({content:content,ts:Date.now()}))
}
function _autosaveClear(){localStorage.removeItem(_autosaveKey())}
function _checkUnsaved(){
  var saved=_autosaveLoad();
  if(saved&&saved.content&&saved.content!==_lastSavedContent){
    if(confirm('Hai modifiche locali non salvate ('+new Date(saved.ts).toLocaleTimeString()+'). Ripristinare?')){
      return saved.content;
    }
  }
  return null;
}
async function _checkRemoteSha(){
  if(!_current||!_current.sha)return true;
  try{
    var d=await ghGet(_current.type==='page'?CONTENT+'/pages/'+_current.k+'.json':_current.type==='db'?CONTENT+'/db/'+_current.file:_current.type==='mestiere'?CONTENT+'/mestieri/'+_current.file:CONTENT+'/docs/'+_current.file);
    return d.sha===_current.sha;
  }catch(e){return true}
}

/* ════════════════════════════════════
   MULTI-USER: gestione utenti e ruoli (salvati in KV)
   ════════════════════════════════════ */
async function _loadUsers(){
  try{
    var r=await fetch('/api/admin?action=get_users',{credentials:'include'});
    if(!r.ok)return [];
    return (await r.json()).users||[];
  }catch(e){return []}
}
async function _saveUsers(users){
  try{
    var r=await fetch('/api/admin?action=set_users',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({users:users})});
    if(!r.ok){
      var j=await r.json().catch(function(){return {}});
      throw new Error(j.error||('Errore '+r.status));
    }
    return true;
  }catch(e){
    toast('Errore salvataggio utenti: '+e.message,'error');
    return false;
  }
}
async function _addUser(username,password,role){
  var users=await _loadUsers();
  if(users.find(u=>u.username===username))return false;
  var hash=await sha256(password);
  users.push({username:username,role:role,passwordHash:hash,created:new Date().toISOString()});
  return _saveUsers(users);
}
async function _updateUser(username,password,role){
  var users=await _loadUsers();
  var idx=users.findIndex(u=>u.username===username);
  if(idx===-1)return false;
  if(password)users[idx].passwordHash=await sha256(password);
  users[idx].role=role;
  users[idx].updated=new Date().toISOString();
  return _saveUsers(users);
}
async function _deleteUser(username){
  if(username==='admin')return false;
  var users=await _loadUsers();
  var idx=users.findIndex(u=>u.username===username);
  if(idx===-1)return false;
  users.splice(idx,1);
  return _saveUsers(users);
}
function _can(action){
  if(_userRole==='admin')return true;
  if(action==='save'||action==='create')return _userRole==='editor'||_userRole==='admin';
  if(action==='delete'||action==='users')return _userRole==='admin';
  return false;
}
function _checkPerm(action){
  if(!_can(action)){
    toast('Permesso negato: serve ruolo '+(action==='delete'||action==='users'?'admin':'editor+'),'error');
    return false;
  }
  return true;
}

/* ════════════════════════════════════
   UTILITIES
   ════════════════════════════════════ */
function sha256(t){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')})}
function esc(t){var d=document.createElement('span');d.textContent=t;return d.innerHTML}
function toast(msg,type){var el=document.createElement('div');el.className='toast '+(type||'');el.textContent=msg;document.getElementById('toast').appendChild(el);setTimeout(function(){el.remove()},3500)}
function setStatus(s,label){var el=document.getElementById('tb-status');el.className='topbar-status '+(s||'idle');el.textContent=label||'pronto'}
function setTitle(t){document.getElementById('tb-section').textContent=t||'Seleziona una voce dal menu'}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sb-overlay').classList.remove('open')}
function toggleSidebar(){
  var sb=document.getElementById('sidebar');
  var ov=document.getElementById('sb-overlay');
  if(sb.classList.contains('open')){sb.classList.remove('open');ov.classList.remove('open')}
  else{sb.classList.add('open');ov.classList.add('open')}
}

function _authHeaders(){return {'Authorization':'token '+_token,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'}}
/* Wrapper API: se il token e' 401 (revocato/scaduto) lo azzera, ne chiede uno nuovo e ritenta */
async function _api(url,opts){
  var r=await fetch(url,opts);
  if(r.status===401){
    _token=prompt('Token GitHub non valido o revocato. Inserisci un nuovo Personal Access Token:');
    if(!_token){_token='';localStorage.removeItem('arcamis_gh_token');throw new Error('GitHub API 401 - token mancante')}
    localStorage.setItem('arcamis_gh_token',_token);
    opts.headers['Authorization']='token '+_token;
    r=await fetch(url,opts);
  }
  return r;
}
/* ── Proxy GitHub server-side (functions/api/gh.js). Se disponibile evita di
   esporre il Personal Access Token nel browser. Ogni operazione ricade sul
   vecchio flusso diretto se la funzione non e' configurata (manca GH_TOKEN). */
async function ghProxy(action,payload){
  var r=await fetch('/api/gh',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:action,payload:payload})});
  if(!r.ok){
    var j=await r.json().catch(function(){return {}});
    throw new Error(j.error||('GH proxy '+r.status));
  }
  return (await r.json()).data;
}
async function ghGet(path){
  try{return await ghProxy('get',{path:path})}
  catch(e){
    var r=await _api('https://api.github.com/repos/'+GH_REPO+'/contents/'+path+'?ref='+GH_BRANCH,{headers:_authHeaders()});
    if(!r.ok)throw new Error('GitHub API '+r.status);return r.json();
  }
}
async function ghGetAt(path,ref){
  try{return await ghProxy('get',{path:path,ref:ref})}
  catch(e){
    var r=await _api('https://api.github.com/repos/'+GH_REPO+'/contents/'+path+'?ref='+ref,{headers:_authHeaders()});
    if(!r.ok)throw new Error('GitHub API '+r.status);return r.json();
  }
}
async function ghPut(path,msg,content,sha){
  try{return await ghProxy('put',{path:path,message:msg,content:btoa(unescape(encodeURIComponent(content))),sha:sha||null})}
  catch(e){
    var headers=_authHeaders();
    async function put(s){var body={message:msg,content:btoa(unescape(encodeURIComponent(content))),branch:GH_BRANCH};if(s)body.sha=s;return _api('https://api.github.com/repos/'+GH_REPO+'/contents/'+path,{method:'PUT',headers:headers,body:JSON.stringify(body)})}
    var r=await put(sha);
    if(r.status===409){var f=await ghGet(path);r=await put(f.sha)}
    if(!r.ok)throw new Error('GitHub API '+r.status);return r.json();
  }
}
/* Carica un file binario (immagine) su GitHub: il content va passato come base64 puro */
async function ghPutBinary(path,msg,dataUri){
  var m=dataUri.match(/^data:[^;]+;base64,(.*)$/);
  var b64=m?m[1]:dataUri;
  try{return await ghProxy('binary',{path:path,message:msg,content:b64,sha:null})}
  catch(e){
    var headers=_authHeaders();
    async function put(s){var body={message:msg,content:b64,branch:GH_BRANCH};if(s)body.sha=s;return _api('https://api.github.com/repos/'+GH_REPO+'/contents/'+path,{method:'PUT',headers:headers,body:JSON.stringify(body)})}
    var r=await put(null);
    if(r.status===409){var f=await ghGet(path);r=await put(f.sha)}
    if(!r.ok)throw new Error('GitHub API '+r.status);return r.json();
  }
}
/* Elimina un file dal repo (serve lo sha del file) */
async function ghDelete(path,msg,sha){
  try{return await ghProxy('delete',{path:path,message:msg,sha:sha})}
  catch(e){
    var headers=_authHeaders();
    async function del(s){var body={message:msg,branch:GH_BRANCH};if(s)body.sha=s;return _api('https://api.github.com/repos/'+GH_REPO+'/contents/'+path,{method:'DELETE',headers:headers,body:JSON.stringify(body)})}
    var r=await del(sha);
    if(r.status===409){var f=await ghGet(path);r=await del(f.sha)}
    if(!r.ok)throw new Error('GitHub API '+r.status);return r.json();
  }
}
/* Cronologia commit di un file */
async function ghCommits(path){
  try{return await ghProxy('commits',{path:path,per_page:25})}
  catch(e){
    var r=await _api('https://api.github.com/repos/'+GH_REPO+'/commits?path='+encodeURIComponent(path)+'&per_page=25&sha='+GH_BRANCH,{headers:_authHeaders()});
    if(!r.ok)throw new Error('GitHub API '+r.status);return r.json();
  }
}

/* ════════════════════════════════════
   AUTH
   ════════════════════════════════════ */
document.getElementById('login-pw').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});
var _loginUser=document.getElementById('login-user');
if(_loginUser)_loginUser.addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});
async function doLogin(){
  var user=document.getElementById('login-user').value.trim();
  var pw=document.getElementById('login-pw').value;
  var remember=document.getElementById('login-remember')?document.getElementById('login-remember').checked:false;
  document.getElementById('login-err').style.display='none';
  var btn=document.querySelector('.login-btn');
  if(btn)btn.disabled=true;
  var ok=false,role='editor',serverAuth=false,serverReachable=true;
  /* 1. Login server-side (crea sessione in KV + cookie HttpOnly) */
  try{
    var r=await fetch('/api/admin?action=login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user,password:pw,remember:remember})});
    ok=r.ok;
    if(ok){var j=await r.json();role=j.role||'editor';serverAuth=true;}
  }catch(e){ok=false;serverReachable=false;}
  /* 2. Fallback hash hardcoded SOLO se il server non è raggiungibile.
        Se il server è attivo ma rifiuta le credenziali niente login locale:
        senza sessione server-side le operazioni (es. gestione utenti)
        fallirebbero con "Non autenticato". */
  if(!ok&&!serverReachable){
    var h=await sha256(pw);
    if(h===ADMIN_PW){ok=true;role='admin';}
  }
  if(!ok){
    var errEl=document.getElementById('login-err');
    errEl.textContent=serverReachable?'Credenziali errate':'Server non raggiungibile';
    errEl.style.display='';
    if(btn)btn.disabled=false;
    return;
  }
  if(btn)btn.disabled=false;
  if(!serverAuth)toast('Login offline: le operazioni server-side (es. gestione utenti) non saranno disponibili','error');
  _currentUser=user;_userRole=role;
  sessionStorage.setItem('arcadmin','1');
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='flex';
  var ucName=document.getElementById('uc-name'),ucRole=document.getElementById('uc-role');
  if(ucName)ucName.textContent=user;
  if(ucRole)ucRole.textContent=role;
  _startAutosave();
  var restored=_checkUnsaved();
  if(restored&&_current){_autosaveClear()}
  buildSidebar();
  renderDashboard();
  toast('Benvenuto, '+user+' ('+role+')','success');
}
function doLogout(){
  sessionStorage.removeItem('arcadmin');
  fetch('/api/admin?action=logout',{method:'POST',credentials:'include'}).catch(function(){});
  _stopAutosave();_autosaveClear();
  _currentUser=null;_userRole='admin';
  _token=null;localStorage.removeItem('arcamis_gh_token');
  document.getElementById('app').style.display='none';
  document.getElementById('login').style.display='flex';
  document.getElementById('login-pw').value='';
}

function buildSidebar(){

  h+='<div class="sidebar-scroll" id="sb-scroll">';

  h+=sbGroup('Pagine Wiki','page',PAGES,'openNewPageModal');
  h+=sbGroup('Database','db',DB_FILES);
  h+=sbGroup('Mestieri','mestiere',MESTIERI);
  h+=sbGroup('Documenti','doc',DOCS);
  h+='<div class="sb-group"><div class="sb-label">Immagini</div>';

  }

function sbGroup(label,type,items,onAdd){
  var h='<div class="sb-group"><div class="sb-label">'+label+(onAdd?' <button class="sb-add" onclick="'+onAdd+'()" title="Crea nuova '+label+'">+</button>':'')+'</div>';
  items.forEach(function(it){
    h+='<div class="sb-item" data-type="'+type+'" data-key="'+(it.k||it.file)+'" onclick="openItem(this)">';
    h+='<span class="ico">'+it.i+'</span><span class="lbl">'+it.l+'</span></div>';
  });
  return h+'</div>';
}
function filterSidebar(q){
  q=q.toLowerCase();
  document.querySelectorAll('.sb-item').forEach(function(el){
    var lbl=el.querySelector('.lbl').textContent.toLowerCase();
    el.style.display=lbl.indexOf(q)!==-1?'':'none';
  });
  document.querySelectorAll('.sb-group').forEach(function(g){
    var vis=g.querySelectorAll('.sb-item:not([style*="display: none"])').length;
    g.style.display=vis?'':'none';
  });
}
function setActive(type,key){
  document.querySelectorAll('.sb-item').forEach(function(el){
    el.classList.toggle('active',el.dataset.type===type&&el.dataset.key===key);
  });
}

function _dashGrid(label,type,items){
  if(!items||!items.length)return '';
  var h='<div class="dash-sec"><div class="dash-sec-title">'+label+'<span class="ds-count">'+items.length+'</span></div><div class="dash-grid">';
  items.forEach(function(it){
    h+='<div class="dash-card" data-type="'+type+'" data-key="'+(it.k||it.file)+'" onclick="dashOpen(this)">'
      +'<span class="dc-ico">'+it.i+'</span><span class="dc-lbl">'+it.l+'</span><span class="dc-type">'+type+'</span></div>';
  });
  return h+'</div></div>';
}
function renderDashboard(){
  _current=null;
  setTitle('Dashboard');
  setStatus('idle','pronto');
  var h='<div class="dash">';
  h+='<div class="dash-head"><h2>Dashboard</h2>';
  h+='<button class="btn btn-primary" onclick="openNewPageModal()" style="padding:6px 12px;font-size:11px">➕ Nuova pagina</button>';
  h+='<button class="btn btn-ghost" onclick="openContentSearch()" style="padding:6px 12px;font-size:11px">🔎 Cerca contenuto</button>';
  h+='</div>';
  h+='<div class="dash-stats">';
  h+='<div class="stat-card" onclick="scrollToSec(0)"><span class="sc-ico">📄</span><div><div class="sc-num">'+PAGES.length+'</div><div class="sc-lbl">Pagine wiki</div></div></div>';
  h+='<div class="stat-card" onclick="scrollToSec(1)"><span class="sc-ico">🗄️</span><div><div class="sc-num">'+DB_FILES.length+'</div><div class="sc-lbl">Database</div></div></div>';
  h+='<div class="stat-card" onclick="scrollToSec(2)"><span class="sc-ico">⚒️</span><div><div class="sc-num">'+MESTIERI.length+'</div><div class="sc-lbl">Mestieri</div></div></div>';
  h+='<div class="stat-card" onclick="scrollToSec(3)"><span class="sc-ico">📜</span><div><div class="sc-num">'+DOCS.length+'</div><div class="sc-lbl">Documenti</div></div></div>';
  h+='</div>';
  h+=_dashGrid('Pagine wiki','page',PAGES);
  h+=_dashGrid('Database','db',DB_FILES);
  h+=_dashGrid('Mestieri','mestiere',MESTIERI);
  h+=_dashGrid('Documenti','doc',DOCS);
  h+='</div>';
  document.getElementById('main').innerHTML=h;
}
function dashOpen(el){
  if(_modified&&!confirm('Hai modifiche non salvate. Continuare?'))return;
  var type=el.getAttribute('data-type'),key=el.getAttribute('data-key');
  var map={page:openPage,db:openDb,mestiere:openMestiere,doc:openDoc};
  if(!map[type])return;
  _modified=false;setActive(type,key);
  setStatus('saving','caricamento...');
  map[type](key).then(function(){setStatus('ok','caricato');setTimeout(function(){setStatus('idle','pronto')},1500)})
    .catch(function(e){setStatus('err','errore');toast(e.message,'error')});
}
function showDashboard(){renderDashboard()}
function scrollToSec(idx){
  var secs=document.querySelectorAll('.dash .dash-sec');
  if(secs[idx])secs[idx].scrollIntoView({behavior:'smooth',block:'start'});
}

/* ════════════════════════════════════
   OPEN ITEMS
   ════════════════════════════════════ */
async function openItem(el){
  if(_modified&&!confirm('Hai modifiche non salvate. Continuare?'))return;
  var type=el.dataset.type, key=el.dataset.key;
  setActive(type,key);
  _modified=false;
  closeSidebar();
  setStatus('saving','caricamento...');
  try{
    if(type==='page') await openPage(key);
    else if(type==='db') await openDb(key);
    else if(type==='mestiere') await openMestiere(key);
    else if(type==='doc') await openDoc(key);
    setStatus('ok','caricato');
    setTimeout(function(){setStatus('idle','pronto')},1500);
  }catch(e){setStatus('err','errore');toast(e.message,'error')}
}

}

function onMdKey(e){
  var ta=document.getElementById('e-md');if(!ta)return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();savePage();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='b'){e.preventDefault();runCmd('bold');return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='i'){e.preventDefault();runCmd('italic');return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();runCmd(e.shiftKey?'redo':'undo');return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();runCmd('redo');return}
  if(e.key==='Tab'){
    e.preventDefault();
    var s=ta.selectionStart,en=ta.selectionEnd,val=ta.value;
    if(s===en){
      ta.value=val.substring(0,s)+'  '+val.substring(en);
      ta.selectionStart=ta.selectionEnd=s+2;
    }else{
      var ls=val.lastIndexOf('\n',s-1)+1;
      var le=val.indexOf('\n',en);le=le===-1?val.length:le+1;
      var block=val.substring(ls,le);
      var nb=e.shiftKey?block.replace(/^  /gm,''):block.replace(/^/gm,'  ');
      if(e.shiftKey&&nb===block)nb=block.replace(/^\t/gm,'');
      ta.value=val.substring(0,ls)+nb+val.substring(le);
      ta.selectionStart=ls;ta.selectionEnd=ls+nb.length;
    }
    onMdInput();return;
  }
}
function _currentHead(){

    var meta=(_current.type==='db'?DB_FILES:_current.type==='mestiere'?MESTIERI:DOCS).find(function(f){return f.file===_current.file});
    return {icon:(meta&&meta.i)||'📄',title:_current.label||''};
  }
  return {icon:'📄',title:'Anteprima'};
}

function buildOutline(){

function setViewMode(m){
  _viewMode=m;

  var body=document.getElementById('editor-body');if(!body)return;
  var mdP=document.getElementById('md-pane'),pvP=document.getElementById('pv-pane');
  var div=document.getElementById('e-divider'),frame=document.getElementById('site-frame');

      frame.style.display='block';

      }

  }

  body.style.display='flex';
  if(m==='md'){
    if(mdP){mdP.style.display='flex';mdP.style.flex='1 1 auto'}
    if(pvP)pvP.style.display='none';
    if(div)div.style.display='none';

    if(mdP)mdP.style.display='none';
    if(pvP){pvP.style.display='flex';pvP.style.flex='1 1 auto'}
    if(div)div.style.display='none';

function _bindDivider(){
  var div=document.getElementById('e-divider');if(!div)return;
  div.addEventListener('mousedown',function(e){
    e.preventDefault();
    var body=document.getElementById('editor-body');if(!body)return;
    div.classList.add('dragging');
    function onMove(ev){var rect=body.getBoundingClientRect();var pct=(ev.clientX-rect.left)/rect.width*100;_mdSplit=Math.max(20,Math.min(80,pct));var mdP=document.getElementById('md-pane');if(mdP)mdP.style.flex=_mdSplit+' 1 0%'}
    function onUp(){document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);div.classList.remove('dragging')}
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
  });
}
function _toggleTodo(todoEl){
  var md=document.getElementById('e-md');if(!md)return;
  var nowChecked=!todoEl.classList.contains('checked');
  todoEl.classList.toggle('checked',nowChecked);
  var idx=parseInt(todoEl.getAttribute('data-line'),10);
  var ls=md.value.split('\n');
  if(idx>=0&&idx<ls.length&&/^\s*[-*+]\s+\[[ xX]\]\s?/.test(ls[idx])){
    ls[idx]=ls[idx].replace(/\[[ xX]\]\s?/,nowChecked?'[x] ':'[ ] ');
    md.value=ls.join('\n');
    onMdInput();
  }
}

function _bindEditorEvents(){
  if(window.__arcEditorBound)return;
  window.__arcEditorBound=true;
  document.addEventListener('click',function(ev){
    if(!document.getElementById('e-md'))return;
    var t=ev.target.closest('[data-cmd]');
    if(t&&t.closest('#e-toolbar')){runCmd(t.getAttribute('data-cmd'));return}
    t=ev.target.closest('[data-view]');
    if(t){setViewMode(t.getAttribute('data-view'));return}
    t=ev.target.closest('.ol-item');
    if(t){jumpToLine(parseInt(t.getAttribute('data-off'),10));return}
    t=ev.target.closest('.n-todo');
    if(t&&t.closest('#e-preview')){_toggleTodo(t);ev.preventDefault();return}
    t=ev.target.closest('a');
    if(t&&t.closest('#e-preview')&&!t.classList.contains('n-anchor')){ev.preventDefault();window.open(t.getAttribute('href'),'_blank');return}
    t=ev.target.closest('img');
    if(t&&t.closest('#e-preview')){zoomPreviewImg(t);return}
  });
  document.addEventListener('keydown',function(ev){
    if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='s'){
      var ta=document.getElementById('e-md');
      if(ta){ev.preventDefault();savePage()}
    }
  });
  window.addEventListener('resize',function(){if(document.getElementById('e-preview'))buildOutline()});
}

}
function wrapMd(before,after){var ta=document.getElementById('e-md');var s=ta.selectionStart,en=ta.selectionEnd;var sel=ta.value.substring(s,en);ta.value=ta.value.substring(0,s)+before+sel+after+ta.value.substring(en);ta.selectionStart=s+before.length;ta.selectionEnd=s+before.length+sel.length;ta.focus();onMdInput()}
function lineMd(prefix){var ta=document.getElementById('e-md');var s=ta.selectionStart;var lineStart=ta.value.lastIndexOf('\n',s-1)+1;ta.value=ta.value.substring(0,lineStart)+prefix+ta.value.substring(lineStart);ta.selectionStart=ta.selectionEnd=s+prefix.length;ta.focus();onMdInput()}

function imgFileSelected(input){
  var file=input.files&&input.files[0];
  if(!file){_imgDataUri=null;return}
  var status=document.getElementById('img-status');
  if(status)status.textContent='Elaborazione…';
  var reader=new FileReader();
  reader.onload=function(e){
    compressImg(e.target.result,function(b64){
      _imgDataUri=b64;
      var pv=document.getElementById('img-preview');
      if(pv){pv.src=b64;pv.classList.add('show')}
      var btn=document.getElementById('img-upload-btn');
      if(btn)btn.disabled=false;
      if(status)status.textContent='Immagine pronta ('+Math.round(b64.length/1024)+' KB)';
    });
  };
  reader.readAsDataURL(file);
}
function compressImg(dataUrl,cb){
  var img=new Image();
  img.onload=function(){
    var MAX=900,w=img.width,h=img.height;
    if(w>MAX){h=Math.round(h*MAX/w);w=MAX}
    if(h>MAX){w=Math.round(w*MAX/h);h=MAX}
    var c=document.createElement('canvas');
    c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    cb(c.toDataURL('image/jpeg',0.82));
  };
  img.src=dataUrl;
}

function _imgExt(dataUri){
  var m=dataUri.match(/^data:image\/([a-zA-Z0-9.+-]+);/);

  return t;
}

function slugify(t){
  return (t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/-+/g,'-').replace(/^-+|-+$/g,'');
}

  var tpl=LAYOUT_TEMPLATES[layout]||'';

async function createNewPage(){
  var label=(document.getElementById('np-label').value||'').trim();
  var icon=(document.getElementById('np-icon').value||'').trim()||'📄';
  var slug=(document.getElementById('np-slug').value||'').trim()||slugify(label);
  var sec=document.getElementById('np-sec').value||'';
  var layout=document.getElementById('np-layout').value||'';
  if(!label){toast('Inserisci un nome per la sezione','error');return}
  if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)){toast('Slug non valido: solo minuscole, numeri e trattini','error');return}
  if(PAGES.some(function(p){return p.k===slug})){toast('Esiste già una pagina con slug "'+slug+'"','error');return}
  var id='pag-'+slug;
  var btn=document.getElementById('np-save');
  if(btn)btn.disabled=true;
  setStatus('saving','creazione...');
  try{
    var json={k:slug,title:label,icon:icon,content:buildNewPageContent(layout,label),layout:layout,lastModified:new Date().toISOString()};
    await ghPut(CONTENT+'/pages/'+slug+'.json','admin: create page '+slug,JSON.stringify(json,null,2),null);
    await addToDataJs(slug,label,icon,id,sec);
    await addToPathMap(slug,id,sec);
    await addToAdminPages(slug,label,icon,sec);
    PAGES.push({k:slug,l:label,i:icon,sec:sec,c:1});
    buildSidebar();
    closeNewPageModal();
    toast('Pagina "'+label+'" creata! Deploy in corso (~30s)...','success');
    setStatus('ok','deploying...');
    startDeployTimer();
    _modified=false;
    await openPage(slug);
    setActive('page',slug);
  }catch(e){
    setStatus('err','errore');
    toast('Errore creazione: '+e.message,'error');
    if(btn)btn.disabled=false;
  }
}
function _arrayInsert(s,marker,close,entry){
  var start=s.indexOf(marker);
  if(start===-1)throw new Error('Marker non trovato: '+marker);
  var end=s.indexOf(close,start);
  if(end===-1)throw new Error('Chiusura non trovata: '+close);
  var before=s.slice(0,end).replace(/\s+$/,'');
  if(before.slice(-1)!==',')before+=',';
  return before+'\n'+entry+s.slice(end);
}
/* Registra la nuova pagina in data.js (array pages) */
async function addToDataJs(slug,label,icon,id,sec){
  var d=await ghGet('scripts/js/data.js');
  var s=decodeURIComponent(escape(atob(d.content)));
  var start=s.indexOf('var pages = [');
  if(start===-1)throw new Error('data.js: "var pages" non trovato');
  var end=s.indexOf('];',start);
  if(end===-1)throw new Error('data.js: chiusura pages non trovata');
  if(s.slice(start,end).indexOf("k:'"+slug+"'")!==-1)throw new Error('Pagina già registrata in data.js');
  var entry='  {k:'+JSON.stringify(slug)+', l:'+JSON.stringify(label)+', i:'+JSON.stringify(icon)+', id:'+JSON.stringify(id)+', sec:'+JSON.stringify(sec)+'},\n';
  await ghPut('scripts/js/data.js','admin: add page '+slug+' to registry',_arrayInsert(s,'var pages = [','];',entry),d.sha);
}
/* Registra l'URL pulito in app.js (_pathMap) */
async function addToPathMap(slug,id,sec){
  var d=await ghGet('scripts/js/app.js');
  var s=decodeURIComponent(escape(atob(d.content)));
  var start=s.indexOf('var _pathMap = {');
  if(start===-1)throw new Error('app.js: "_pathMap" non trovato');
  var end=s.indexOf('};',start);
  if(end===-1)throw new Error('app.js: chiusura _pathMap non trovata');
  var path=sec?(sec+'/'+slug):slug;
  if(s.slice(start,end).indexOf("'"+path+"'")!==-1)throw new Error('URL già registrato: /'+path);
  var entry='  '+JSON.stringify(path)+': '+JSON.stringify(id)+',\n';
  await ghPut('scripts/js/app.js','admin: add page '+slug+' to path map',_arrayInsert(s,'var _pathMap = {','};',entry),d.sha);
}

function _removeLine(s,re){
  var lines=s.split('\n');
  for(var i=0;i<lines.length;i++){
    if(re.test(lines[i])){lines.splice(i,1);return {s:lines.join('\n'),found:true}}
  }
  return {s:s,found:false};
}
function _cleanLastComma(s,marker,close){
  var start=s.indexOf(marker);
  if(start===-1)return s;
  var end=s.indexOf(close,start);
  if(end===-1)return s;
  var before=s.slice(0,end).replace(/\s+$/,'');
  if(before.slice(-1)!==',')return s;
  return before.slice(0,-1)+'\n'+close+s.slice(end+close.length);
}
async function removeFromDataJs(slug){
  var d=await ghGet('scripts/js/data.js');
  var s=decodeURIComponent(escape(atob(d.content)));
  var r=_removeLine(s,new RegExp('k:["\']'+slug+'["\']'));
  if(r.found)await ghPut('scripts/js/data.js','admin: remove page '+slug+' from registry',_cleanLastComma(r.s,'var pages = [','];'),d.sha);
}
async function removeFromPathMap(id){
  var d=await ghGet('scripts/js/app.js');
  var s=decodeURIComponent(escape(atob(d.content)));

  if(r.found)await ghPut('scripts/js/app.js','admin: remove page '+id+' from path map',_cleanLastComma(r.s,'var _pathMap = {','};'),d.sha);
}
async function removeFromAdminPages(slug){
  var d=await ghGet('admin/index.html');

}

  var meta=PAGES.find(function(p){return p.k===_current.k});

  var label=_current.title||_current.k;

    ?'Eliminare definitivamente la pagina "'+label+'"?\n\nVerranno rimossi contenuto, voce del menu e URL dedicato. Questa operazione non è reversibile.'
    :'Eliminare la sezione "'+label+'"?\n\nAttenzione: è una sezione predefinita del sito. Verranno rimossi il contenuto locale, la voce dal menu (desktop e mobile), la card dalla home e l\'URL dedicato. Questa operazione non è reversibile.';

/* Recupera l'id (Notion o custom) della pagina dal registro data.js */
async function _getPageId(slug){
  try{
    var d=await ghGet('scripts/js/data.js');
    var s=decodeURIComponent(escape(atob(d.content)));
    var m=s.match(new RegExp("k:[\"']"+slug+"[\"'][^}]*?id:[\"']([^\"']+)[\"']"));
    return m?m[1]:null;
  }catch(e){return null}
}
/* Sostituisce il valore di una chiave (l:/i:) in una riga di array JS */
function _replaceKV(line,key,val){
  var v=JSON.stringify(val);
  return line.replace(new RegExp(key+":(\"[^\"]*\"|'[^']*')"),key+":"+v);
}
async function renameInDataJs(slug,label,icon){
  var d=await ghGet('scripts/js/data.js');
  var s=decodeURIComponent(escape(atob(d.content)));
  var lines=s.split('\n');
  var idx=-1;
  for(var i=0;i<lines.length;i++){if(new RegExp('k:["\']'+slug+'["\']').test(lines[i])){idx=i;break}}
  if(idx===-1)throw new Error('data.js: pagina '+slug+' non trovata');
  lines[idx]=_replaceKV(lines[idx],'l',label);
  lines[idx]=_replaceKV(lines[idx],'i',icon);
  await ghPut('scripts/js/data.js','admin: rename page '+slug,lines.join('\n'),d.sha);
}
async function renameInAdminPages(slug,label,icon){
  var d=await ghGet('admin/index.html');
  var s=decodeURIComponent(escape(atob(d.content)));
  var lines=s.split('\n');
  var start=s.indexOf('var PAGES = [');
  if(start===-1)throw new Error('admin: "var PAGES" non trovato');
  var idx=-1;
  for(var i=0;i<lines.length;i++){
    if(new RegExp('k:["\']'+slug+'["\']').test(lines[i])&&s.indexOf(lines[i])>start){idx=i;break}
  }
  if(idx===-1)throw new Error('admin: pagina '+slug+' non trovata in PAGES');
  lines[idx]=_replaceKV(lines[idx],'l',label);
  lines[idx]=_replaceKV(lines[idx],'i',icon);

/* ── Sincronizzazione del menu hardcoded in index.html ── */
function _gpArg(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function _rewriteIndexForPage(html,id,label,icon){
  var L=_gpArg(label),I=_gpArg(icon),LH=esc(label),IH=esc(icon);
  /* voce menu desktop */
  html=html.replace(new RegExp("(<div class=\"tn-item\"[^>]*gp\\('"+id+"','[^']*','[^']*'\\)[^>]*>)<span class=\"tn-ii\">[^<]*</span>[^<]*(</div>)"),
    "$1<span class=\"tn-ii\">"+IH+"</span>"+LH+"$2");
  /* voce menu mobile */
  html=html.replace(new RegExp("(<div class=\"mn-item\"[^>]*gp\\('"+id+"','[^']*','[^']*'\\)[^>]*>)<span class=\"mn-ii\">[^<]*</span>[^<]*(</div>)"),
    "$1<span class=\"mn-ii\">"+IH+"</span>"+LH+"$2");
  /* card home: icona */
  html=html.replace(new RegExp("(<div class=\"lcard\"[^>]*gp\\('"+id+"','[^']*','[^']*'\\)[^>]*><div class=\"shine\"></div><div class=\"cthumb\"[^>]*>)<span>[^<]*</span>"),
    "$1<span>"+IH+"</span>");
  /* card home: titolo */
  html=html.replace(new RegExp("(<div class=\"lcard\"[^>]*gp\\('"+id+"','[^']*','[^']*'\\)[^>]*>[^\\n]*?<div class=\"ctit\">)[^<]*(</div>)"),
    "$1"+LH+"$2");
  /* argomenti gp() ovunque (es. bottom nav) */
  html=html.replace(new RegExp("gp\\('"+id+"','[^']*','[^']*'\\)"),"gp('"+id+"','"+L+"','"+I+"')");
  return html;
}
function _removeIndexForPage(html,id){
  html=html.replace(new RegExp("<div class=\"tn-item\"[^>]*gp\\('"+id+"','[^']*','[^']*'\\)[^>]*>[^\\n]*"),'');
  html=html.replace(new RegExp("<div class=\"mn-item\"[^>]*gp\\('"+id+"','[^']*','[^']*'\\)[^>]*>[^\\n]*"),'');
  html=html.replace(new RegExp("<div class=\"lcard\"[^>]*gp\\('"+id+"','[^']*','[^']*'\\)[^>]*>[^\\n]*"),'');
  html=html.replace(new RegExp("<div class=\"bnav-item\"[^>]*gp\\('"+id+"','[^']*','[^']*'\\)[^>]*>[^\\n]*"),'');
  return html;
}

var _contentIndex=null,_contentIndexLoading=false;
async function _loadContentIndex(){
  if(_contentIndex)return _contentIndex;
  if(_contentIndexLoading)return null;
  _contentIndexLoading=true;
  try{
    var list=await ghGet('content/pages');
    var idx=[];
    for(var i=0;i<list.length;i++){
      var it=list[i];
      if(!it||it.type!=='file'||!it.name||it.name.slice(-5)!=='.json')continue;
      try{
        var c=await ghGet('content/pages/'+it.name);
        var j=JSON.parse(decodeURIComponent(escape(atob(c.content))));
        idx.push({k:j.k||it.name.replace('.json',''),title:j.title||'',icon:j.icon||'',content:j.content||''});
      }catch(e){}
    }
    _contentIndex=idx;
  }catch(e){_contentIndex=[]}
  _contentIndexLoading=false;
  return _contentIndex;
}

  if(document.getElementById('cs-modal'))return;
  var d=document.createElement('div');
  d.className='img-modal-backdrop';
  d.id='cs-modal';
  d.innerHTML='<div class="list-modal">'
    +'<h3>🔎 Cerca nel contenuto</h3>'

    +'<div class="list-body" id="cs-body"><div class="list-empty">Digita almeno 3 caratteri…</div></div>'
    +'<div class="img-actions"><button class="btn btn-ghost" onclick="closeModal(\'cs-modal\')">Chiudi</button></div>'
    +'</div>';
  d.addEventListener('click',function(e){if(e.target===d)closeModal('cs-modal')});
  document.body.appendChild(d);
  document.getElementById('cs-input').addEventListener('input',function(){_runContentSearch()});
  document.getElementById('cs-input').focus();

async function _runContentSearch(){
  var input=document.getElementById('cs-input');
  var body=document.getElementById('cs-body');
  if(!input||!body)return;
  var q=input.value.trim().toLowerCase();
  if(q.length<3){body.innerHTML='<div class="list-empty">Digita almeno 3 caratteri…</div>';return}
  body.innerHTML='<div class="list-empty">Ricerca…</div>';
  var idx=await _loadContentIndex();
  if(!idx){body.innerHTML='<div class="list-empty">Nessun contenuto indicizzato</div>';return}
  var hits=[];
  idx.forEach(function(p){
    var c=p.content.toLowerCase();
    var pos=c.indexOf(q);
    if(pos===-1)return;
    var start=Math.max(0,pos-60),end=Math.min(p.content.length,pos+q.length+60);
    var snip=(start>0?'…':'')+p.content.slice(start,end).replace(/\s*\n+\s*/g,' ')+(end<p.content.length?'…':'');
    hits.push({p:p,snip:snip});
  });
  if(!hits.length){body.innerHTML='<div class="list-empty">Nessun risultato per "'+esc(q)+'"</div>';return}
  body.innerHTML=hits.map(function(h){
    return '<div class="list-item" onclick="openSearchHit(\''+esc(h.p.k)+'\')">'
      +'<span>'+h.p.icon+'</span>'
      +'<div class="li-main"><div class="li-title">'+esc(h.p.title)+'</div>'
      +'<div class="li-snippet">'+esc(h.snip)+'</div></div></div>';
  }).join('');
}

var _pathMapCached=null;
async function _getPathMap(){
  if(_pathMapCached)return _pathMapCached;
  var d=await ghGet('scripts/js/app.js');
  var s=decodeURIComponent(escape(atob(d.content)));
  var start=s.indexOf('var _pathMap = {');
  var end=s.indexOf('};',start);
  if(start===-1||end===-1){_pathMapCached={};return _pathMapCached}
  var block=s.slice(start+15,end);
  var pm={};
  block.split('\n').forEach(function(line){
    var m=line.match(/^\s*['"]([^'"]+)['"]\s*:\s*['"]([^'"]+)['"],?\s*$/);
    if(m)pm[m[1]]=m[2];
  });
  _pathMapCached=pm;
  return pm;
}
async function checkLinks(){
  if(!_current||_current.type!=='page')return;
  var md=document.getElementById('e-md').value;
  var links=[];
  var re=/(?:^|[\s("'`])(\/[a-zA-Z0-9\-_/]+)/g,m;
  while((m=re.exec(md)))links.push(m[1].trim());
  links=links.filter(function(l){return l.indexOf('/images/')!==0&&l.indexOf('/audio/')!==0&&l.indexOf('/scripts/')!==0});
  if(!links.length){toast('Nessun link interno trovato nel contenuto','success');return}
  setStatus('saving','verifica link…');
  try{
    var pm=await _getPathMap();
    var bad=links.filter(function(l){
      var p=l.replace(/^\//,'').replace(/\/+$/,'');
      return !pm.hasOwnProperty(p);
    });
    var d=document.createElement('div');
    d.className='img-modal-backdrop';
    d.id='lk-modal';
    var rows=bad.length?bad.map(function(l){return '<div class="list-item" style="cursor:default"><div class="li-main"><div class="li-title" style="color:var(--red)">🔗 '+esc(l)+'</div><div class="li-sub">non presente in _pathMap</div></div></div>'}).join('')
      :'<div class="list-empty">Tutti i '+links.length+' link interni risultano validi ✓</div>';
    d.innerHTML='<div class="list-modal">'
      +'<h3>🔗 Link interni — '+links.length+' trovati, '+bad.length+' sospetti</h3>'
      +'<div class="list-body">'+rows+'</div>'
      +'<div class="img-actions"><button class="btn btn-ghost" onclick="closeModal(\'lk-modal\')">Chiudi</button></div></div>';
    d.addEventListener('click',function(e){if(e.target===d)closeModal('lk-modal')});
    document.body.appendChild(d);
    setStatus('idle','pronto');
  }catch(e){setStatus('err','errore');toast(e.message,'error')}
}

async function _pageCleanPath(){

    {k:'title',t:'text',req:true},{k:'content',t:'textarea',req:true}
  ],
  'patenti.json':[
    {k:'key',t:'text',req:true},{k:'content',t:'textarea',req:true},{k:'lastModified',t:'text'}
  ],
  'codice.json':[
    {k:'key',t:'text',req:true},{k:'content',t:'textarea',req:true},{k:'lastModified',t:'text'}
  ],
  'come-funzionano.json':[
    {k:'key',t:'text',req:true},{k:'content',t:'textarea',req:true},{k:'lastModified',t:'text'}
  ]
};
function _isArrayFile(file){return file in JSON_TABLE_SCHEMAS}
function _getSchema(file){return JSON_TABLE_SCHEMAS[file]||[]}

/* ════════════════════════════════════
   DB / MESTIERE / DOC EDITORS
   ════════════════════════════════════ */
async function openDb(file){
  var meta=DB_FILES.find(function(d){return d.file===file});
  var path=CONTENT+'/db/'+file;
  var content='[]',sha=null;
  try{var d=await ghGet(path);content=decodeURIComponent(escape(atob(d.content)));sha=d.sha}catch(e){}
  _current={type:'db',file:file,sha:sha,label:meta?meta.l:file};
  setTitle((meta?meta.i:'📄')+' '+(meta?meta.l:file));
  if(_isArrayFile(file))renderTableEditor(content,file);else renderJsonEditor(content);
}
async function openMestiere(file){
  var meta=MESTIERI.find(function(m){return m.file===file});
  var path=CONTENT+'/mestieri/'+file;
  var raw='{}',sha=null;
  try{var d=await ghGet(path);raw=decodeURIComponent(escape(atob(d.content)));sha=d.sha}catch(e){}
  var arr=[];
  try{var parsed=JSON.parse(raw);if(Array.isArray(parsed)){parsed.forEach(function(p){if(Array.isArray(p)&&p.length>=2)arr.push({title:p[0],content:p[1]})});}}catch(e){}
  var content=JSON.stringify(arr,null,2);
  _current={type:'mestiere',file:file,sha:sha,label:meta?meta.l:file,raw:raw};
  setTitle((meta?meta.i:'📄')+' '+(meta?meta.l:file));
  renderTableEditor(content,file);
}
async function openDoc(file){
  var meta=DOCS.find(function(d){return d.file===file});
  var path=CONTENT+'/docs/'+file;
  var raw='{}',sha=null;
  try{var d=await ghGet(path);raw=decodeURIComponent(escape(atob(d.content)));sha=d.sha}catch(e){}
  var obj={};
  try{obj=JSON.parse(raw)}catch(e){}
  var content=JSON.stringify([obj],null,2);
  _current={type:'doc',file:file,sha:sha,label:meta?meta.l:file,raw:raw};
  setTitle((meta?meta.i:'📄')+' '+(meta?meta.l:file));
  renderTableEditor(content,file);
}
function renderJsonEditor(content){
  var h='<div class="editor">';
  h+='<div class="editor-head"><h2>'+esc(_current.label)+'</h2>';
  h+='<span class="badge badge-idle" id="e-badge">salvato</span>';
  h+='<div class="editor-actions">';
  h+='<button class="btn btn-ghost" onclick="switchToTable()">Tabella</button>';
  h+='<button class="btn btn-danger" id="del-btn" onclick="deleteJsonFile()">ELIMINA</button>';
  h+='<button class="btn btn-primary" id="save-btn" onclick="saveJson()">SALVA</button>';
  h+='</div></div>';
  h+='<div class="editor-body"><div class="pane" style="display:flex;flex-direction:column">';
  h+='<div class="pane-head">JSON Data</div>';
  h+='<textarea id="e-json" style="flex:1" oninput="_modified=true;setBadge(\'dirty\',\'modificato\')">'+esc(content)+'</textarea>';
  h+='</div></div></div>';
  document.getElementById('main').innerHTML=h;
}
function switchToTable(){
  if(!_current||!_isArrayFile(_current.file))return;
  try{var arr=JSON.parse(document.getElementById('e-json').value);renderTableEditor(JSON.stringify(arr),_current.file);}catch(e){toast('JSON non valido','error')}
}
function renderTableEditor(jsonStr,file){
  var schema=_getSchema(file);
  var arr=[];
  try{arr=JSON.parse(jsonStr)}catch(e){arr=[]}
  if(!Array.isArray(arr))arr=[];
  var cols=schema.map(function(c){return c.k});
  var h='<div class="editor">';
  h+='<div class="editor-head"><h2>'+esc(_current.label)+'</h2>';
  h+='<span class="badge badge-idle" id="e-badge">salvato</span>';
  h+='<div class="editor-actions">';
  h+='<button class="btn btn-ghost" onclick="renderJsonEditor(JSON.stringify(arr,null,2))">JSON</button>';
  h+='<button class="btn btn-ghost" onclick="addTableRow()">➕ Riga</button>';
  h+='<button class="btn btn-danger" id="del-btn" onclick="deleteJsonFile()">ELIMINA</button>';
  h+='<button class="btn btn-primary" id="save-btn" onclick="saveTable()">SALVA</button>';
  h+='</div></div>';
  h+='<div class="editor-body"><div class="table-pane" style="display:flex;flex-direction:column;flex:1;overflow:auto">';
  h+='<div class="pane-head">Editor tabella ('+arr.length+' righe)</div>';
  h+='<div class="table-wrap" style="flex:1;overflow:auto">';
  h+='<table class="admin-table"><thead><tr>';
  cols.forEach(function(c){h+='<th>'+esc(c)+'</th>'});
  h+='<th style="width:60px">Azioni</th></tr></thead><tbody id="table-body">';
  arr.forEach(function(row,i){h+=buildTableRow(row,i,schema)});
  h+='</tbody></table></div></div></div></div>';
  document.getElementById('main').innerHTML=h;
}
function buildTableRow(row,idx,schema){
  var h='<tr data-idx="'+idx+'">';
  schema.forEach(function(col){
    var val=row[col.k]!==undefined?row[col.k]:'';
    var type=col.t==='textarea'?'textarea':('input type="'+(col.t==='number'?'number':col.t==='url'?'url':'text')+'"');
    var req=col.req?' required':'';
    h+='<td><'+type+' value="'+esc(String(val))+'" data-col="'+esc(col.k)+'"'+req+' style="width:100%;box-sizing:border-box;padding:4px 6px;font-family:inherit;font-size:12px;"></td>';
  });
  h+='<td><button class="btn btn-danger" onclick="deleteTableRow(this)" style="padding:3px 6px;font-size:10px">🗑</button></td>';
  h+='</tr>';
  return h;
}
function addTableRow(){
  var schema=_getSchema(_current.file);
  var tbody=document.getElementById('table-body');
  if(!tbody)return;
  var idx=tbody.children.length;
  tbody.insertAdjacentHTML('beforeend',buildTableRow({},idx,schema));
}
function deleteTableRow(btn){
  var tr=btn.closest('tr');
  if(tr)tr.remove();
  renumberTableRows();
}
function renumberTableRows(){
  var tbody=document.getElementById('table-body');
  if(!tbody)return;
  Array.from(tbody.children).forEach(function(tr,i){tr.dataset.idx=i});
}
function tableToArray(){
  var tbody=document.getElementById('table-body');
  if(!tbody)return [];
  var schema=_getSchema(_current.file);
  var arr=[];
  Array.from(tbody.children).forEach(function(tr){
    var row={};
    var valid=true;
    tr.querySelectorAll('input,textarea').forEach(function(inp){
      var col=inp.dataset.col;
      var val=inp.value;
      var req=inp.hasAttribute('required');
      if(req&&!val.trim())valid=false;
      if(val!=='')row[col]=val;
    });
    if(valid)arr.push(row);
  });
  return arr;
}
async function saveTable(){
  if(!_current)return;
  var arr=tableToArray();
  var file=_current.file;
  var json,path;
  if(file.indexOf('.json')!==-1&&_current.type==='mestiere'){
    var out=[];
    arr.forEach(function(r){out.push([r.title||'',r.content||''])});
    json=JSON.stringify(out,null,2);
    path=CONTENT+'/mestieri/'+file;
  }else if(file.indexOf('.json')!==-1&&_current.type==='doc'){
    json=JSON.stringify(arr[0]||{},null,2);
    path=CONTENT+'/docs/'+file;
  }else{
    json=JSON.stringify(arr,null,2);
    path=CONTENT+'/db/'+file;
  }
  document.getElementById('e-json').value=json;
  setStatus('saving','verifica conflitti...');
  if(!await _checkRemoteSha()){
    if(!confirm('⚠️ Il file è stato modificato da un\'altra sessione. Sovrascrivere comunque?')){setStatus('idle','annullato');return}
  }
  setStatus('saving','salvataggio...');
  document.getElementById('save-btn').disabled=true;
  try{
    var r=await ghPut(path,'admin: update '+file,json,_current.sha);
    if(r&&r.content&&r.content.sha)_current.sha=r.content.sha;
    _modified=false;setBadge('ok','salvato');setStatus('ok','deploying...');
    await _logAudit('save_'+_current.type,file,{rows:arr.length});
    toast('Salvato! Deploy Cloudflare in corso...','success');
    startDeployTimer();
  }catch(e){setBadge('err','errore');setStatus('err','errore');toast(e.message,'error')}
  document.getElementById('save-btn').disabled=false;
}
async function saveJson(){
  if(!_current)return;
  var content=document.getElementById('e-json').value;
  try{JSON.parse(content)}catch(e){toast('JSON non valido: '+e.message,'error');return}
  var paths={page:CONTENT+'/pages/'+_current.k+'.json',db:CONTENT+'/db/'+_current.file,mestiere:CONTENT+'/mestieri/'+_current.file,doc:CONTENT+'/docs/'+_current.file};
  var path=paths[_current.type];
  setStatus('saving','verifica conflitti...');
  if(!await _checkRemoteSha()){
    if(!confirm('⚠️ Il file è stato modificato da un\'altra sessione. Sovrascrivere comunque?')){setStatus('idle','annullato');return}
  }
  setStatus('saving','salvataggio...');
  document.getElementById('save-btn').disabled=true;
  try{
    var r=await ghPut(path,'admin: update '+(_current.file||_current.k),content,_current.sha);
    if(r&&r.content&&r.content.sha)_current.sha=r.content.sha;
    _modified=false;setBadge('ok','salvato');setStatus('ok','deploying...');
    await _logAudit('save_'+_current.type,_current.file||_current.k,{});
    toast('Salvato! Deploy Cloudflare in corso...','success');
    startDeployTimer();
  }catch(e){setBadge('err','errore');setStatus('err','errore');toast(e.message,'error')}
  document.getElementById('save-btn').disabled=false;
}
async function deleteJsonFile(){
  if(!_current||_current.type==='page')return;
  var label=_current.label||_current.file;
  var path=_current.type==='db'?CONTENT+'/db/'+_current.file:_current.type==='mestiere'?CONTENT+'/mestieri/'+_current.file:CONTENT+'/docs/'+_current.file;
  if(!_current.sha){toast('File non esistente nel repo: '+path,'error');return}
  if(!confirm('Eliminare definitivamente il file "'+label+'" ('+path+')?\n\nAttenzione: se qualche pagina del sito lo usa, quella funzionalità si romperà. Questa operazione non è reversibile.'))return;
  var btn=document.getElementById('del-btn');
  if(btn)btn.disabled=true;
  setStatus('saving','eliminazione...');
  try{
    await ghDelete(path,'admin: delete '+_current.file,_current.sha);
    _modified=false;
    _current=null;
    buildSidebar();
    document.getElementById('main').innerHTML='<div class="main-empty"><div class="ico">🗑</div><p>'+esc(label)+' eliminato</p></div>';
    setTitle('Seleziona una voce dal menu');
    toast('File eliminato! Deploy in corso (~30s)...','success');
    setStatus('ok','deploying...');
    startDeployTimer();
  }catch(e){
    setStatus('err','errore');
    toast('Errore eliminazione: '+e.message,'error');
    if(btn)btn.disabled=false;
  }
}

/* ════════════════════════════════════
   BADGE
   ════════════════════════════════════ */
function setBadge(cls,label){var b=document.getElementById('e-badge');if(b){b.className='badge badge-'+cls;b.textContent=label}}

/* ════════════════════════════════════
   MARKDOWN → HTML
   Usa il renderer condiviso scripts/js/md-render.js
   (caricato in head), che produce la stessa resa del sito.
   ════════════════════════════════════ */
function mdToHtml(md){
  if(!md)return'';
  if(typeof window.mdRender==='function'){
    try{
      var out=window.mdRender(md);
      if(out)return out;
    }catch(e){}
  }
  /* fallback legacy */
  md=md.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  md=md.replace(/```(\w*)\n([\s\S]*?)```/g,'<pre><code>$2</code></pre>');
  md=md.replace(/`([^`]+)`/g,'<code>$1</code>');
  md=md.replace(/^#### (.+)$/gm,'<h4>$1</h4>');
  md=md.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  md=md.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  md=md.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  md=md.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  md=md.replace(/\*(.+?)\*/g,'<em>$1</em>');
  md=md.replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>');
  md=md.replace(/^---$/gm,'<hr>');
  md=md.replace(/^- (.+)$/gm,'<li>$1</li>');
  md=md.replace(/^\d+\. (.+)$/gm,'<li>$1</li>');
  md=md.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  md=md.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1" style="max-width:100%;border-radius:4px">');
  md=md.replace(/((?:^\|.*\|[^\n]*\n?)+)/gm,function(m,t){
    var rows=t.trim().split('\n').filter(function(r){return !/^\|[\s\-:|]+\|$/.test(r)});
    if(!rows.length)return m;
    var h=rows[0].replace(/^\||\|$/g,'').split('|').map(function(c){return '<th>'+c.trim()+'</th>'}).join('');
    var b=rows.slice(1).map(function(r){return '<tr>'+r.replace(/^\||\|$/g,'').split('|').map(function(c){return '<td>'+c.trim()+'</td>'}).join('')+'</tr>'}).join('');
    return '<table><tr>'+h+'</tr>'+b+'</table>';
  });
  md=md.replace(/\n\n/g,'</p><p>');
  md=md.replace(/\n/g,'<br>');
  return'<p>'+md+'</p>';
}

/* ════════════════════════════════════
   DEPLOY TIMER
   Mostra countdown dopo salvataggio
   ════════════════════════════════════ */
var _deployInterval=null;
function startDeployTimer(){
  if(_deployInterval)clearInterval(_deployInterval);
  var el=document.getElementById('tb-status');
  var start=Date.now();
  var lastPing=0;
  var realDeploy=false;
  el.className='topbar-status saving';
  el.textContent='deploy in corso…';
  async function pingDeploy(){
    try{
      var r=await fetch('/api/deploy',{credentials:'include'});
      var j=await r.json();
      if(j.configured){
        realDeploy=true;
        if(j.status==='success'){
          clearInterval(_deployInterval);_deployInterval=null;
          el.className='topbar-status ok';
          el.textContent='deploy completato';
          toast('Deploy completato! Ricarica il sito per vedere le modifiche.','success');
          return true;
        }
        el.textContent='deploy: '+j.status;
      }
    }catch(e){}
    return false;
  }
  _deployInterval=setInterval(function(){
    var now=Date.now();
    if(now-lastPing>=10000){lastPing=now;pingDeploy();}
    var sec=Math.max(0,45-Math.round((now-start)/1000));
    if(sec<=0){
      clearInterval(_deployInterval);_deployInterval=null;
      pingDeploy().then(function(done){
        if(done)return;
        el.className='topbar-status ok';
        el.textContent='deploy completato';
        toast('Deploy completato! Ricarica il sito per vedere le modifiche.','success');
      });
    }else if(!realDeploy){
      el.textContent='deploy in '+sec+'s…';
    }
  },1000);
}
