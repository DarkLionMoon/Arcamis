<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcamis Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#080a0e; --bg2:#0c0f15; --bg3:#10141c; --bg4:#161c26;
  --panel:#0e121a; --bdr:#1e1808; --bdr2:#2c2210;
  --gold:#c89b3c; --gold2:#d4aa4a; --gold3:#e8c86a;
  --copper:#7a5018; --parch:#c4a862;
  --text:#a08848; --text2:#786438; --text3:#483c1c; --white:#f0e6d2;
  --red:#c04040; --green:#4a9a58;
}
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:'Crimson Pro',serif; font-size:15px; }

/* ── LOGIN ── */
#login-screen {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:100vh; gap:20px;
}
#login-screen h1 { font-family:'Cinzel',serif; color:var(--gold2); font-size:24px; letter-spacing:.1em; }
#login-screen .subtitle { color:var(--text3); font-size:14px; }
.login-box {
  background:var(--bg2); border:1px solid var(--bdr2); border-radius:8px;
  padding:32px; width:min(400px, 90vw); display:flex; flex-direction:column; gap:16px;
}
.login-box input {
  background:var(--bg3); border:1px solid var(--bdr); border-radius:4px;
  color:var(--white); font-family:'JetBrains Mono',monospace; font-size:14px;
  padding:12px 16px; outline:none; transition:border-color .2s;
}
.login-box input:focus { border-color:var(--gold); }
.login-box input::placeholder { color:var(--text3); }
.login-btn {
  background:var(--gold); color:var(--bg); border:none; border-radius:4px;
  font-family:'Cinzel',serif; font-size:13px; font-weight:700; letter-spacing:.1em;
  padding:12px; cursor:pointer; transition:all .2s;
}
.login-btn:hover { background:var(--gold2); box-shadow:0 0 20px rgba(200,155,60,.3); }
.login-error { color:var(--red); font-size:13px; text-align:center; display:none; }

/* ── APP ── */
#app { display:none; }
.topbar {
  background:var(--bg2); border-bottom:1px solid var(--bdr2);
  padding:12px 24px; display:flex; align-items:center; gap:16px;
  position:sticky; top:0; z-index:100;
}
.topbar h1 { font-family:'Cinzel',serif; color:var(--gold2); font-size:16px; letter-spacing:.08em; flex:1; }
.topbar .section-label { font-family:'Cinzel',serif; font-size:9px; letter-spacing:.15em; color:var(--text3); text-transform:uppercase; }
.logout-btn {
  background:none; border:1px solid var(--bdr); border-radius:4px;
  color:var(--text3); font-family:'Cinzel',serif; font-size:10px; letter-spacing:.1em;
  padding:6px 12px; cursor:pointer; transition:all .2s;
}
.logout-btn:hover { border-color:var(--red); color:var(--red); }

/* ── SIDEBAR ── */
.layout { display:flex; min-height:calc(100vh - 52px); }
.sidebar {
  width:260px; flex-shrink:0; background:var(--bg2); border-right:1px solid var(--bdr);
  overflow-y:auto; padding:16px 0;
}
.sidebar-section { padding:0 0 8px; }
.sidebar-title {
  font-family:'Cinzel',serif; font-size:8px; font-weight:700;
  letter-spacing:.15em; text-transform:uppercase; color:var(--text3);
  padding:8px 16px 6px;
}
.sidebar-item {
  display:flex; align-items:center; gap:10px; padding:8px 16px;
  cursor:pointer; transition:all .15s; border-left:3px solid transparent;
  font-size:14px; color:var(--text2);
}
.sidebar-item:hover { color:var(--gold2); background:rgba(200,155,60,.04); }
.sidebar-item.active { color:var(--gold2); border-left-color:var(--gold); background:rgba(200,155,60,.06); font-weight:600; }
.sidebar-item .icon { font-size:16px; flex-shrink:0; width:24px; text-align:center; }
.sidebar-item .label { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sidebar-item .status { font-size:10px; padding:1px 6px; border-radius:3px; }
.status-local { background:rgba(74,154,88,.15); color:var(--green); border:1px solid rgba(74,154,88,.3); }
.status-remote { background:rgba(200,155,60,.1); color:var(--text3); border:1px solid var(--bdr); }

/* ── MAIN CONTENT ── */
.main-content { flex:1; padding:24px 32px; overflow-y:auto; max-height:calc(100vh - 52px); }
.empty-state {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:100%; color:var(--text3); gap:12px;
}
.empty-state .icon { font-size:48px; opacity:.3; }
.empty-state p { font-size:14px; }

/* ── EDITOR ── */
.editor-header {
  display:flex; align-items:center; gap:12px; margin-bottom:20px;
  padding-bottom:16px; border-bottom:1px solid var(--bdr);
}
.editor-header h2 { font-family:'Cinzel',serif; color:var(--gold2); font-size:18px; flex:1; }
.editor-meta { display:flex; gap:12px; align-items:center; }
.editor-meta .badge {
  font-family:'Cinzel',serif; font-size:8px; letter-spacing:.1em;
  padding:3px 8px; border-radius:3px; text-transform:uppercase;
}
.badge-saved { background:rgba(74,154,88,.15); color:var(--green); border:1px solid rgba(74,154,88,.3); }
.badge-modified { background:rgba(200,155,60,.1); color:var(--gold); border:1px solid var(--bdr2); }
.badge-error { background:rgba(192,64,64,.1); color:var(--red); border:1px solid rgba(192,64,64,.3); }

.editor-toolbar {
  display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;
}
.toolbar-btn {
  background:var(--bg3); border:1px solid var(--bdr); border-radius:4px;
  color:var(--text2); font-family:'Cinzel',serif; font-size:10px; letter-spacing:.08em;
  padding:6px 12px; cursor:pointer; transition:all .15s;
}
.toolbar-btn:hover { border-color:var(--gold); color:var(--gold2); }
.toolbar-btn.active { background:rgba(200,155,60,.1); border-color:var(--gold); color:var(--gold2); }
.toolbar-sep { width:1px; background:var(--bdr); margin:0 4px; }
.save-btn {
  background:var(--gold); color:var(--bg); border:none; border-radius:4px;
  font-family:'Cinzel',serif; font-size:11px; font-weight:700; letter-spacing:.1em;
  padding:8px 20px; cursor:pointer; transition:all .2s;
}
.save-btn:hover { background:var(--gold2); }
.save-btn:disabled { opacity:.5; cursor:not-allowed; }

.editor-container { display:flex; gap:0; height:calc(100vh - 220px); min-height:400px; }
.editor-pane {
  flex:1; display:flex; flex-direction:column; border:1px solid var(--bdr); border-radius:4px;
  overflow:hidden;
}
.editor-pane-header {
  background:var(--bg3); padding:8px 12px; border-bottom:1px solid var(--bdr);
  font-family:'Cinzel',serif; font-size:8px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--text3);
}
.editor-textarea {
  flex:1; background:var(--bg); color:var(--white); border:none; padding:16px 20px;
  font-family:'JetBrains Mono',monospace; font-size:13px; line-height:1.7;
  resize:none; outline:none; tab-size:2;
}
.editor-textarea::placeholder { color:var(--text3); }
.preview-pane {
  flex:1; overflow-y:auto; padding:20px 24px; background:var(--bg);
  border-left:1px solid var(--bdr);
}
.preview-pane h1,.preview-pane h2,.preview-pane h3,.preview-pane h4 {
  font-family:'Cinzel',serif; color:var(--gold2); margin:20px 0 10px;
}
.preview-pane h1 { font-size:24px; }
.preview-pane h2 { font-size:18px; border-bottom:1px solid var(--bdr); padding-bottom:8px; }
.preview-pane h3 { font-size:14px; color:var(--parch); }
.preview-pane p { margin-bottom:12px; line-height:1.7; color:var(--parch); }
.preview-pane ul,.preview-pane ol { margin:8px 0 12px 20px; }
.preview-pane li { margin-bottom:4px; color:var(--parch); }
.preview-pane blockquote {
  border-left:3px solid var(--gold); padding:8px 16px; margin:12px 0;
  background:rgba(200,155,60,.04); color:var(--text2); font-style:italic;
}
.preview-pane code {
  background:var(--bg3); padding:2px 6px; border-radius:3px;
  font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--gold);
}
.preview-pane pre { background:var(--bg3); padding:16px; border-radius:4px; overflow-x:auto; margin:12px 0; }
.preview-pane pre code { background:none; padding:0; }
.preview-pane table { width:100%; border-collapse:collapse; margin:12px 0; }
.preview-pane th,.preview-pane td { padding:8px 12px; border:1px solid var(--bdr); text-align:left; }
.preview-pane th { background:var(--bg3); font-family:'Cinzel',serif; font-size:10px; letter-spacing:.08em; color:var(--gold); text-transform:uppercase; }
.preview-pane a { color:var(--gold); text-decoration:underline; }
.preview-pane hr { border:none; border-top:1px solid var(--bdr); margin:20px 0; }
.preview-pane strong { color:var(--white); }
.preview-pane em { color:var(--text2); }

/* ── JSON EDITOR ── */
.json-editor { display:none; flex-direction:column; height:100%; }
.json-editor.active { display:flex; }
.json-textarea {
  flex:1; background:var(--bg); color:var(--green); border:none; padding:16px 20px;
  font-family:'JetBrains Mono',monospace; font-size:13px; line-height:1.6;
  resize:none; outline:none; tab-size:2;
}

/* ── MODALS ── */
.modal-overlay {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,.7);
  z-index:200; align-items:center; justify-content:center;
}
.modal-overlay.open { display:flex; }
.modal {
  background:var(--bg2); border:1px solid var(--bdr2); border-radius:8px;
  padding:24px; width:min(500px, 90vw); max-height:80vh; overflow-y:auto;
}
.modal h3 { font-family:'Cinzel',serif; color:var(--gold2); margin-bottom:16px; }
.modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:20px; }
.modal-btn {
  font-family:'Cinzel',serif; font-size:10px; letter-spacing:.1em;
  padding:8px 16px; border-radius:4px; cursor:pointer; transition:all .15s;
}
.modal-btn-cancel { background:var(--bg3); border:1px solid var(--bdr); color:var(--text3); }
.modal-btn-cancel:hover { border-color:var(--bdr2); color:var(--text2); }
.modal-btn-danger { background:rgba(192,64,64,.15); border:1px solid rgba(192,64,64,.3); color:var(--red); }
.modal-btn-danger:hover { background:rgba(192,64,64,.25); }

/* ── TOAST ── */
.toast {
  position:fixed; bottom:24px; right:24px; z-index:300;
  background:var(--bg2); border:1px solid var(--bdr2); border-radius:6px;
  padding:12px 20px; font-size:13px; color:var(--parch);
  box-shadow:0 8px 32px rgba(0,0,0,.5);
  transform:translateY(100px); opacity:0; transition:all .3s;
}
.toast.show { transform:translateY(0); opacity:1; }
.toast.success { border-color:rgba(74,154,88,.4); }
.toast.error { border-color:rgba(192,64,64,.4); }

/* ── SETTINGS ── */
.settings-section { margin-bottom:24px; }
.settings-section h3 {
  font-family:'Cinzel',serif; font-size:11px; font-weight:700;
  letter-spacing:.12em; text-transform:uppercase; color:var(--gold);
  margin-bottom:12px; padding-bottom:6px; border-bottom:1px solid var(--bdr);
}
.settings-row { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
.settings-label { font-size:13px; color:var(--text2); min-width:140px; }
.settings-input {
  flex:1; background:var(--bg3); border:1px solid var(--bdr); border-radius:4px;
  color:var(--white); font-family:'JetBrains Mono',monospace; font-size:12px;
  padding:8px 12px; outline:none;
}
.settings-input:focus { border-color:var(--gold); }
.settings-save {
  background:var(--gold); color:var(--bg); border:none; border-radius:4px;
  font-family:'Cinzel',serif; font-size:10px; font-weight:700; letter-spacing:.1em;
  padding:8px 16px; cursor:pointer;
}

/* ── RESPONSIVE ── */
@media (max-width:860px) {
  .sidebar { display:none; }
  .editor-container { flex-direction:column; height:auto; }
  .preview-pane { border-left:none; border-top:1px solid var(--bdr); max-height:50vh; }
}
</style>
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<div id="login-screen">
  <h1>⚔ ARCAMIS</h1>
  <div class="subtitle">Pannello Amministrazione</div>
  <div class="login-box">
    <input type="password" id="login-pw" placeholder="Password..." autofocus>
    <button class="login-btn" onclick="doLogin()">ACCEDI</button>
    <div class="login-error" id="login-error">Password errata</div>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="app">
  <div class="topbar">
    <h1>⚔ ARCAMIS ADMIN</h1>
    <span class="section-label" id="current-section">Pagine Wiki</span>
    <button class="logout-btn" onclick="doLogout()">ESCI</button>
  </div>
  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-content" id="main-content">
      <div class="empty-state">
        <div class="icon">📄</div>
        <p>Seleziona un contenuto dal menu laterale</p>
      </div>
    </div>
  </div>
</div>

<!-- ═══ TOAST ═══ -->
<div class="toast" id="toast"></div>

<script>
/* ════════════════════════════════════
   ARCAMIS — admin.js
   Pannello amministrazione con
   auth password + GitHub API
════════════════════════════════════ */

// ── CONFIG ──
var ADMIN_PW_HASH = 'b0b9dd19ef971d0b25d73afa6c1b1a1a52aff81b4c6259e067aa305e187119f5'; // sha256 of "BASTADRAMA104"
var GITHUB_REPO = 'DarkLionMoon/Arcamis';
var GITHUB_BRANCH = 'main';
var CONTENT_PATH = 'content';

// ── STATE ──
var _token = null;
var _currentPage = null;
var _modified = false;
var _pages = [];
var _dbFiles = [];
var _mestieriFiles = [];
var _docsFiles = [];

// ── SHA-256 ──
async function sha256(text) {
  var buffer = new TextEncoder().encode(text);
  var hash = await crypto.subtle.digest('SHA-256', buffer);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// ── AUTH ──
async function doLogin() {
  var pw = document.getElementById('login-pw').value;
  var hash = await sha256(pw);
  if (hash !== ADMIN_PW_HASH) {
    document.getElementById('login-error').style.display = 'block';
    return;
  }
  _token = localStorage.getItem('arcamis_gh_token');
  if (!_token) {
    _token = prompt('Inserisci il tuo GitHub Personal Access Token:');
    if (!_token) return;
    localStorage.setItem('arcamis_gh_token', _token);
  }
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadSidebar();
}

function doLogout() {
  _token = null;
  localStorage.removeItem('arcamis_gh_token');
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-pw').value = '';
}

document.getElementById('login-pw').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

// ── GITHUB API ──
async function ghGet(path) {
  var url = 'https://api.github.com/repos/' + GITHUB_REPO + '/contents/' + path + '?ref=' + GITHUB_BRANCH;
  var res = await fetch(url, { headers: { 'Authorization': 'token ' + _token, 'Accept': 'application/vnd.github.v3+json' } });
  if (!res.ok) throw new Error('GitHub API error: ' + res.status);
  return res.json();
}

async function ghPut(path, message, content, sha) {
  var url = 'https://api.github.com/repos/' + GITHUB_REPO + '/contents/' + path;
  var body = { message: message, content: btoa(unescape(encodeURIComponent(content))), branch: GITHUB_BRANCH };
  if (sha) body.sha = sha;
  var res = await fetch(url, {
    method: 'PUT',
    headers: { 'Authorization': 'token ' + _token, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error('GitHub API error: ' + res.status);
  return res.json();
}

// ── SIDEBAR ──
async function loadSidebar() {
  var html = '';
  
  // Pages
  html += '<div class="sidebar-section">';
  html += '<div class="sidebar-title">Pagine Wiki</div>';
  for (var i = 0; i < PAGES.length; i++) {
    var p = PAGES[i];
    html += '<div class="sidebar-item" onclick="openPage(\'' + p.k + '\')" data-k="' + p.k + '">';
    html += '<span class="icon">' + p.i + '</span>';
    html += '<span class="label">' + p.l + '</span>';
    html += '</div>';
  }
  html += '</div>';
  
  // DB
  html += '<div class="sidebar-section">';
  html += '<div class="sidebar-title">Database</div>';
  for (var i = 0; i < DB_FILES.length; i++) {
    var d = DB_FILES[i];
    html += '<div class="sidebar-item" onclick="openDb(\'' + d.file + '\')" data-file="' + d.file + '">';
    html += '<span class="icon">' + d.icon + '</span>';
    html += '<span class="label">' + d.label + '</span>';
    html += '</div>';
  }
  html += '</div>';
  
  // Mestieri
  html += '<div class="sidebar-section">';
  html += '<div class="sidebar-title">Mestieri</div>';
  for (var i = 0; i < MESTIERI_FILES.length; i++) {
    var m = MESTIERI_FILES[i];
    html += '<div class="sidebar-item" onclick="openMestiere(\'' + m.file + '\')" data-file="' + m.file + '">';
    html += '<span class="icon">' + m.icon + '</span>';
    html += '<span class="label">' + m.label + '</span>';
    html += '</div>';
  }
  html += '</div>';
  
  // Docs
  html += '<div class="sidebar-section">';
  html += '<div class="sidebar-title">Documenti</div>';
  for (var i = 0; i < DOCS_FILES.length; i++) {
    var dc = DOCS_FILES[i];
    html += '<div class="sidebar-item" onclick="openDoc(\'' + dc.file + '\')" data-file="' + dc.file + '">';
    html += '<span class="icon">' + dc.icon + '</span>';
    html += '<span class="label">' + dc.label + '</span>';
    html += '</div>';
  }
  html += '</div>';
  
  // Settings
  html += '<div class="sidebar-section">';
  html += '<div class="sidebar-title">Sistema</div>';
  html += '<div class="sidebar-item" onclick="openSettings()">';
  html += '<span class="icon">⚙️</span>';
  html += '<span class="label">Impostazioni</span>';
  html += '</div>';
  html += '</div>';
  
  document.getElementById('sidebar').innerHTML = html;
}

// ── PAGE EDITOR ──
async function openPage(k) {
  if (_modified && !confirm('Hai modifiche non salvate. Continuare?')) return;
  _currentPage = { type: 'page', k: k };
  _modified = false;
  setActiveSidebar('k', k);
  
  var meta = PAGES.find(function(p) { return p.k === k; });
  document.getElementById('current-section').textContent = meta ? meta.l : k;
  
  var container = document.getElementById('main-content');
  container.innerHTML = '<div class="empty-state"><div class="icon">⏳</div><p>Caricamento...</p></div>';
  
  try {
    var path = CONTENT_PATH + '/pages/' + k + '.json';
    var data = await ghGet(path);
    var content = decodeURIComponent(escape(atob(data.content)));
    var json = JSON.parse(content);
    renderPageEditor(meta, json, data.sha);
  } catch(e) {
    // File doesn't exist — create new
    var json = { k: k, title: meta ? meta.l : k, icon: meta ? meta.i : '📄', content: '# ' + (meta ? meta.l : k) + '\n\nInserisci il contenuto qui...', lastModified: new Date().toISOString() };
    renderPageEditor(meta, json, null);
  }
}

function renderPageEditor(meta, json, sha) {
  var container = document.getElementById('main-content');
  var html = '';
  
  html += '<div class="editor-header">';
  html += '<h2>' + (meta ? meta.i + ' ' + meta.l : json.k) + '</h2>';
  html += '<div class="editor-meta">';
  html += '<span class="badge badge-saved" id="save-status">Salvato</span>';
  html += '<button class="toolbar-btn" onclick="showPageJson()">JSON</button>';
  html += '<button class="save-btn" onclick="savePage()">SALVA</button>';
  html += '</div>';
  html += '</div>';
  
  html += '<div class="editor-toolbar">';
  html += '<button class="toolbar-btn" onclick="insertMd(\'**\',\'**\')"><b>B</b></button>';
  html += '<button class="toolbar-btn" onclick="insertMd(\'*\',\'*\')"><i>I</i></button>';
  html += '<button class="toolbar-btn" onclick="insertMd(\'### \',\'\')">H3</button>';
  html += '<button class="toolbar-btn" onclick="insertMd(\'## \',\'\')">H2</button>';
  html += '<button class="toolbar-btn" onclick="insertMd(\'# \',\'\')">H1</button>';
  html += '<div class="toolbar-sep"></div>';
  html += '<button class="toolbar-btn" onclick="insertMd(\'- \',\'\')">Lista</button>';
  html += '<button class="toolbar-btn" onclick="insertMd(\'1. \',\'\')">Lista Ord.</button>';
  html += '<button class="toolbar-btn" onclick="insertMd(\'> \',\'\')">Citazione</button>';
  html += '<div class="toolbar-sep"></div>';
  html += '<button class="toolbar-btn" onclick="insertMd(\'[testo](\', \')\')">Link</button>';
  html += '<button class="toolbar-btn" onclick="insertMd(\'```,\'```\')">Codice</button>';
  html += '<button class="toolbar-btn" onclick="insertMd(\'---\\n\',\'\')">HR</button>';
  html += '</div>';
  
  html += '<div class="editor-container">';
  html += '<div class="editor-pane">';
  html += '<div class="editor-pane-header">Markdown</div>';
  html += '<textarea class="editor-textarea" id="editor-md" oninput="onEditorInput()" onkeydown="onEditorKeydown(event)">' + escapeHtml(json.content || '') + '</textarea>';
  html += '</div>';
  html += '<div class="editor-pane preview-pane" id="editor-preview"></div>';
  html += '</div>';
  
  // JSON view (hidden)
  html += '<div class="json-editor" id="json-editor">';
  html += '<div class="editor-pane-header" style="background:var(--bg3);padding:8px 12px;border-bottom:1px solid var(--bdr);font-family:Cinzel,serif;font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3)">JSON</div>';
  html += '<textarea class="json-textarea" id="editor-json"></textarea>';
  html += '</div>';
  
  container.innerHTML = html;
  
  // Store metadata
  container.dataset.sha = sha || '';
  container.dataset.k = json.k;
  container.dataset.title = json.title || '';
  container.dataset.icon = json.icon || '';
  
  // Render preview
  renderPreview();
}

function onEditorInput() {
  _modified = true;
  document.getElementById('save-status').className = 'badge badge-modified';
  document.getElementById('save-status').textContent = 'Modificato';
  renderPreview();
}

function onEditorKeydown(e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    var ta = document.getElementById('editor-md');
    var start = ta.selectionStart;
    var end = ta.selectionEnd;
    ta.value = ta.value.substring(0, start) + '  ' + ta.value.substring(end);
    ta.selectionStart = ta.selectionEnd = start + 2;
    onEditorInput();
  }
  if (e.ctrlKey && e.key === 's') {
    e.preventDefault();
    savePage();
  }
}

function renderPreview() {
  var md = document.getElementById('editor-md').value;
  document.getElementById('editor-preview').innerHTML = markdownToHtml(md);
}

function insertMd(before, after) {
  var ta = document.getElementById('editor-md');
  var start = ta.selectionStart;
  var end = ta.selectionEnd;
  var selected = ta.value.substring(start, end);
  var replacement = before + selected + after;
  ta.value = ta.value.substring(0, start) + replacement + ta.value.substring(end);
  ta.selectionStart = start + before.length;
  ta.selectionEnd = start + before.length + selected.length;
  ta.focus();
  onEditorInput();
}

function showPageJson() {
  var jsonEditor = document.getElementById('json-editor');
  var editorContainer = document.querySelector('.editor-container');
  if (jsonEditor.classList.contains('active')) {
    jsonEditor.classList.remove('active');
    editorContainer.style.display = 'flex';
    // Apply JSON changes back to markdown
    try {
      var json = JSON.parse(document.getElementById('editor-json').value);
      document.getElementById('editor-md').value = json.content || '';
      renderPreview();
    } catch(e) {}
  } else {
    var container = document.getElementById('main-content');
    var json = {
      k: container.dataset.k,
      title: container.dataset.title,
      icon: container.dataset.icon,
      content: document.getElementById('editor-md').value,
      lastModified: new Date().toISOString()
    };
    document.getElementById('editor-json').value = JSON.stringify(json, null, 2);
    editorContainer.style.display = 'none';
    jsonEditor.classList.add('active');
  }
}

async function savePage() {
  var container = document.getElementById('main-content');

function setActiveSidebar(key, value) {

    el.classList.remove('active');
    if (key && value && el.dataset[key] === value) el.classList.add('active');
  });
}

function escapeHtml(text) {
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  setTimeout(function() { t.className = 'toast'; }, 3000);
}

// ── MARKDOWN → HTML ──
function markdownToHtml(md) {
  var html = md
    // Code blocks
    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
    // Inline code
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    // Headers
    .replace(/^#### (.+)$/gm, '<h4>$1</h4>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    // Bold & italic
    .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    // Blockquote
    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
    // HR
    .replace(/^---$/gm, '<hr>')
    // Unordered list
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    // Ordered list
    .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
    // Links
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
    // Images
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" style="max-width:100%">')
    // Paragraphs
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>');
  
  return '<p>' + html + '</p>';
}
